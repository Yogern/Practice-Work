lain_text": "Часть С\n14.\n1) Негативное влияние: образование токсичных и трудноразлагаемых отходов (обрезки кабелей, ПВХ-изоляция, ртутьсодержащие лампы, отработанные аккумуляторы), повреждение почвенного слоя при прокладке траншей.\n2) Меры по снижению: раздельный сбор и сдача лома металлов (медь, алюминий) и пластика на переработку; сдача люминесцентных ламп и АКБ в спецорганизации для демеркуризации и утилизации; бережная прокладка подземных линий с восстановлением (рекультивацией) грунта.\n4 З/ (оценка и подпись преподавателя)\nМногообразие подходов к выделению регионов мира\nРегион — это территория, которая обладает определённой целостностью и взаимосвязанностью составляющих её элементов.\nПодходы к выделению регионов могут быть разнообразными: физико-географические, экономико-географические, по уровню развития и специализации, природные условия, политические; культурно-исторические.", "table_text": ""}, {"page": 30, "date": null, "title": "Субрегионы Зарубежной Европы", "source_filename": "IMG_20261124_201812.webp", "captured_at_ms": "2026-11-24 20:18:13.052", "original_webp": "originals/page_30.webp", "blocks": [{"type": "heading", "level": 1, "text": "Субрегионы Зарубежной Европы."}, {"type": "table", "caption": "Субрегионы Зарубежной Европы", "continued_from_prev": false, "continues_to_next": false, "headers": ["Субрегионы", "Состав / примеры стран", "Ключевые особенности"], "rows": [["Западная Европа", "Франция, Германия, Великобритания, Нидерланды, Австрия, Швейцария, Бельгия.", "Высокоразвитая экономика, мощная промышленность и сфера услуг, «ядро» европейской интеграции, развитая финансовая система."], ["Северная Европа", "Швеция, Норвегия, Финляндия, Дания, Исландия.", "Высокий уровень жизни («скандинавская модель»), опора на природные ресурсы (нефть, гидроэнергетика, лес), рыболовство, судостроение и высокие технологии."], ["Южная Европа", "Италия, Испания, Португалия, Греция.", "Крупнейший мировой центр туризма, развитое субтропическое сельское хозяйство (виноградарство, оливководство, цитрусовые), контраст индустриального севера и аграрного юга."], ["Восточная Европа", "Польша, Чехия, Словакия, Венгрия, Румыния, Болгария.", "Страны с переходной экономикой, развитое машиностроение, металлургия, химическая промышленность, развитое сельское хозяйство, выгодное транзитное положение."]]}], "uncertain_words": [], "plain_text": "Субрегионы Зарубежной Европы.\nСубрегионы Зарубежной Европы\nСубрегионы\nСостав / примеры стран\nКлючевые особенности\nЗападная Европа\nФранция, Германия, Великобритания, Нидерланды, Австрия, Швейцария, Бельгия.\nВысокоразвитая экономика, мощная промышленность и сфера услуг, «ядро» европейской интеграции, развитая финансовая система.\nСеверная Европа\nШвеция, Норвегия, Финляндия, Дания, Исландия.\nВысокий уровень жизни («скандинавская модель»), опора на природные ресурсы (нефть, гидроэнергетика, лес), рыболовство, судостроение и высокие технологии.\nЮжная Европа\nИталия, Испания, Португалия, Греция.\nКрупнейший мировой центр туризма, развитое субтропическое сельское хозяйство (виноградарство, оливководство, цитрусовые), контраст индустриального севера и аграрного юга.\nВосточная Европа\nПольша, Чехия, Словакия, Венгрия, Румыния, Болгария.\nСтраны с переходной экономикой, развитое машиностроение, металлургия, химическая промышленность, развитое сельское хозяйство, выгодное транзитное положение.", "table_text": "Субрегионы Зарубежной Европы\nСубрегионы\nСостав / примеры стран\nКлючевые особенности\nЗападная Европа\nФранция, Германия, Великобритания, Нидерланды, Австрия, Швейцария, Бельгия.\nВысокоразвитая экономика, мощная промышленность и сфера услуг, «ядро» европейской интеграции, развитая финансовая система.\nСеверная Европа\nШвеция, Норвегия, Финляндия, Дания, Исландия.\nВысокий уровень жизни («скандинавская модель»), опора на природные ресурсы (нефть, гидроэнергетика, лес), рыболовство, судостроение и высокие технологии.\nЮжная Европа\nИталия, Испания, Португалия, Греция.\nКрупнейший мировой центр туризма, развитое субтропическое сельское хозяйство (виноградарство, оливководство, цитрусовые), контраст индустриального севера и аграрного юга.\nВосточная Европа\nПольша, Чехия, Словакия, Венгрия, Румыния, Болгария.\nСтраны с переходной экономикой, развитое машиностроение, металлургия, химическая промышленность, развитое сельское хозяйство, выгодное транзитное положение."}, {"page": 31, "date": "29.10.2026", "title": "Природно-ресурсный капитал Зарубежной Европы. Многообразие подходов к выделению регионов мира", "source_filename": "IMG_20261124_201821.webp", "captured_at_ms": "2026-11-24 20:18:22.205", "original_webp": "originals/page_31.webp", "blocks": [{"type": "heading", "level": 1, "text": "Природно-ресурсный капитал Зарубежной Европы."}, {"type": "heading", "level": 2, "text": "1. Общие черты:"}, {"type": "list", "ordered": false, "items": ["Природные условия региона в целом благоприятные для заселения и хозяйственного освоения.", "Преобладание равнинного рельефа.", "Мягкий климат"]}, {"type": "heading", "level": 2, "text": "Минеральные ресурсы:"}, {"type": "list", "ordered": false, "items": ["Регион разнообразен по составу полезных ископаемых, но запасы их невелики и истощены длительной эксплуатацией.", "Нефть и газ: бассейн Северного моря (Великобритания, Норвегия, Нидерланды).", "Цветные металлы: месторождения Южной Европы (Испания, Италия)."]}, {"type": "callout", "label": "Вывод", "text": "Регион дефицитен по большинству видов минерального сырья и энергоресурсов, что определяет его ориентацию на импорт. Это ключевой фактор, который объясняет зависимость Европы от внешних поставок энергоносителей."}, {"type": "heading", "level": 2, "text": "Сельское хозяйство."}, {"type": "paragraph", "text": "Почвы малоплодородные (за исключением чернозёмов Украины)."}, {"type": "marginalia", "text": "29.10.2026"}, {"type": "heading", "level": 1, "text": "Многообразие подходов к выделению регионов мира"}, {"type": "paragraph", "text": "Для зарубежной Европы характерен низкий естественный прирост."}], "uncertain_words": [], "plain_text": "Природно-ресурсный капитал Зарубежной Европы.\n1. Общие черты:\nПриродные условия региона в целом благоприятные для заселения и хозяйственного освоения.\nПреобладание равнинного рельефа.\nМягкий климат\nМинеральные ресурсы:\nРегион разнообразен по составу полезных ископаемых, но запасы их невелики и истощены длительной эксплуатацией.\nНефть и газ: бассейн Северного моря (Великобритания, Норвегия, Нидерланды).\nЦветные металлы: месторождения Южной Европы (Испания, Италия).\nВывод: Регион дефицитен по большинству видов минерального сырья и энергоресурсов, что определяет его ориентацию на импорт. Это ключевой фактор, который объясняет зависимость Европы от внешних поставок энергоносителей.\nСельское хозяйство.\nПочвы малоплодородные (за исключением чернозёмов Украины).\n29.10.2026\nМногообразие подходов к выделению регионов мира\nДля зарубежной Европы характерен низкий естественный прирост.", "table_text": ""}, {"page": 32, "date": null, "title": "Население и хозяйство Зарубежной Европы. Сравнение Северной и Южной Европы", "source_filename": "IMG_20261124_201829.webp", "captured_at_ms": "2026-11-24 20:18:30.301", "original_webp": "originals/page_32.webp", "blocks": [{"type": "paragraph", "text": "В ряде стран отрицательный, высокий уровень урбанизации до 80–90% при значительной доле иммигрантов."}, {"type": "paragraph", "text": "Во многих странах наблюдается старение населения."}, {"type": "paragraph", "text": "Хозяйство: Зарубежная Европа — один из 3 главных центров. Для региона характерна постиндустриальная структура экономики с доминированием сферы услуг."}, {"type": "table", "caption": "Сравнение Северной и Южной Европы", "continued_from_prev": false, "continues_to_next": true, "headers": ["№", "Критерий сравнения", "Северная Европа", "Южная Европа"], "rows": [["1", "Географическое положение", "Скандинавский п-ов, о. Исландия; выход к Атлантике, Северному и Балтийскому морям.", "Пиренейский, Апеннинский, Балканский п-ова; побережье Средиземного моря."], ["2", "Климат", "Умеренный морской, субарктический; прохладное влажное лето, мягкая / холодная зима.", "Субтропический средиземноморский; сухое жаркое лето, мягкая дождливая зима."], ["3", "Рельеф и геология", "Древние Скандинавские горы, ледниковые равнины, фьорды; тектонически стабильна.", "Молодая складчатость (Альпы, Пиренеи, Апеннины); высокая сейсмичность, вулканизм."], ["4", "Природные ресурсы", "Богата лесом, железной рудой (Швеция), нефтью и газом шельфа (Норвегия).", "Бедна топливом и лесом; есть полиметаллы, ртуть, мрамор, сера."], ["5", "Водные ресурсы", "Избыточное увлажнение; густая сеть порожистых рек с высоким гидропотенциалом, озёра.", "Дефицит пресной воды; реки короткие, сильно мелеют летом; необходимо орошение."], ["6", "Демографическая ситуация", "Первый тип воспроизводства; умеренная рождаемость,", "Глубокая депопуляция («демографическая зима»), самое старое население"]]}], "uncertain_words": [], "plain_text": "В ряде стран отрицательный, высокий уровень урбанизации до 80–90% при значительной доле иммигрантов.\nВо многих странах наблюдается старение населения.\nХозяйство: Зарубежная Европа — один из 3 главных центров. Для региона характерна постиндустриальная структура экономики с доминированием сферы услуг.\nСравнение Северной и Южной Европы\n№\nКритерий сравнения\nСеверная Европа\nЮжная Европа\n1\nГеографическое положение\nСкандинавский п-ов, о. Исландия; выход к Атлантике, Северному и Балтийскому морям.\nПиренейский, Апеннинский, Балканский п-ова; побережье Средиземного моря.\n2\nКлимат\nУмеренный морской, субарктический; прохладное влажное лето, мягкая / холодная зима.\nСубтропический средиземноморский; сухое жаркое лето, мягкая дождливая зима.\n3\nРельеф и геология\nДревние Скандинавские горы, ледниковые равнины, фьорды; тектонически стабильна.\nМолодая складчатость (Альпы, Пиренеи, Апеннины); высокая сейсмичность, вулканизм.\n4\nПриродные ресурсы\nБогата лесом, железной рудой (Швеция), нефтью и газом шельфа (Норвегия).\nБедна топливом и лесом; есть полиметаллы, ртуть, мрамор, сера.\n5\nВодные ресурсы\nИзбыточное увлажнение; густая сеть порожистых рек с высоким гидропотенциалом, озёра.\nДефицит пресной воды; реки короткие, сильно мелеют летом; необходимо орошение.\n6\nДемографическая ситуация\nПервый тип воспроизводства; умеренная рождаемость,\nГлубокая депопуляция («демографическая зима»), самое старое население", "table_text": "Сравнение Северной и Южной Европы\n№\nКритерий сравнения\nСеверная Европа\nЮжная Европа\n1\nГеографическое положение\nСкандинавский п-ов, о. Исландия; выход к Атлантике, Северному и Балтийскому морям.\nПиренейский, Апеннинский, Балканский п-ова; побережье Средиземного моря.\n2\nКлимат\nУмеренный морской, субарктический; прохладное влажное лето, мягкая / холодная зима.\nСубтропический средиземноморский; сухое жаркое лето, мягкая дождливая зима.\n3\nРельеф и геология\nДревние Скандинавские горы, ледниковые равнины, фьорды; тектонически стабильна.\nМолодая складчатость (Альпы, Пиренеи, Апеннины); высокая сейсмичность, вулканизм.\n4\nПриродные ресурсы\nБогата лесом, железной рудой (Швеция), нефтью и газом шельфа (Норвегия).\nБедна топливом и лесом; есть полиметаллы, ртуть, мрамор, сера.\n5\nВодные ресурсы\nИзбыточное увлажнение; густая сеть порожистых рек с высоким гидропотенциалом, озёра.\nДефицит пресной воды; реки короткие, сильно мелеют летом; необходимо орошение.\n6\nДемографическая ситуация\nПервый тип воспроизводства; умеренная рождаемость,\nГлубокая депопуляция («демографическая зима»), самое старое население"}, {"page": 33, "date": "30.10.2026", "title": "Сравнение Северной и Южной Европы (продолжение). Зарубежная Азия", "source_filename": "IMG_20261124_201846.webp", "captured_at_ms": "2026-11-24 20:18:47.636", "original_webp": "originals/page_33.webp", "blocks": [{"type": "table", "caption": "Сравнение Северной и Южной Европы (продолжение)", "continued_from_prev": true, "continues_to_next": false, "headers": ["№", "Критерий сравнения", "Северная Европа", "Южная Европа"], "rows": [["", "", "высокий миграционный прирост.", "в Европе."], ["7", "Уровень урбанизации", "Очень высокий (80–88%); преобладают малые и средние комфортные города.", "Высокий (65–75%); выражены крупные исторические агломерации (Мадрид, Рим)."], ["8", "Языковой состав", "Германская группа (шведы, норвежцы, датчане) + финно-угорская (финны).", "Романская группа (итальянцы, испанцы, португальцы) + греческая."], ["9.", "Природно-ресурсные особенности", "• Ресурсы: богата лесом (тайга), железными рудами (Швеция), нефтью и газом на шельфе Северного моря (Норвегия).", "• Ресурсы: дефицит топлива и леса; есть руды цветных металлов (ртуть, медь, полиметаллы), сера, мрамор."], ["10", "Специализация сельского хозяйства", "Молочно-мясное скотоводство, кормовые травы, морское рыболовство.", "Субтропическое растениеводство (оливки, цитрусовые, виноград), овцеводство."], ["11", "Специализация промышленности", "Лесная и бумажная, качественная металлургия, хай-тек, судостроение.", "Лёгкая (одежда, обувь), пищевая (вино, масло), автопром, нефтепереработка."]]}, {"type": "marginalia", "text": "4 З (отметка преподавателя красной ручкой)"}, {"type": "marginalia", "text": "30.10.2026"}, {"type": "heading", "level": 1, "text": "Тема: «Зарубежная Азия: субрегионы, {{?экономика}} {{?промышленность}} и энергетика ({{?актуальная}} для электромонтажника)»."}], "uncertain_words": [{"word": "{{?экономика}} {{?промышленность}}", "context": "Тема: «Зарубежная Азия: субрегионы, {{?экономика}} {{?промышленность}} и энергетика ({{?актуальная}} для электромонтажника)»."}, {"word": "{{?актуальная}}", "context": "...и энергетика ({{?актуальная}} для электромонтажника)»."}], "plain_text": "Сравнение Северной и Южной Европы (продолжение)\n№\nКритерий сравнения\nСеверная Европа\nЮжная Европа\nвысокий миграционный прирост.\nв Европе.\n7\nУровень урбанизации\nОчень высокий (80–88%); преобладают малые и средние комфортные города.\nВысокий (65–75%); выражены крупные исторические агломерации (Мадрид, Рим).\n8\nЯзыковой состав\nГерманская группа (шведы, норвежцы, датчане) + финно-угорская (финны).\nРоманская группа (итальянцы, испанцы, португальцы) + греческая.\n9.\nПриродно-ресурсные особенности\n• Ресурсы: богата лесом (тайга), железными рудами (Швеция), нефтью и газом на шельфе Северного моря (Норвегия).\n• Ресурсы: дефицит топлива и леса; есть руды цветных металлов (ртуть, медь, полиметаллы), сера, мрамор.\n10\nСпециализация сельского хозяйства\nМолочно-мясное скотоводство, кормовые травы, морское рыболовство.\nСубтропическое растениеводство (оливки, цитрусовые, виноград), овцеводство.\n11\nСпециализация промышленности\nЛесная и бумажная, качественная металлургия, хай-тек, судостроение.\nЛёгкая (одежда, обувь), пищевая (вино, масло), автопром, нефтепереработка.\n4 З (отметка преподавателя красной ручкой)\n30.10.2026\nТема: «Зарубежная Азия: субрегионы, {{?экономика}} {{?промышленность}} и энергетика ({{?актуальная}} для электромонтажника)».", "table_text": "Сравнение Северной и Южной Европы (продолжение)\n№\nКритерий сравнения\nСеверная Европа\nЮжная Европа\nвысокий миграционный прирост.\nв Европе.\n7\nУровень урбанизации\nОчень высокий (80–88%); преобладают малые и средние комфортные города.\nВысокий (65–75%); выражены крупные исторические агломерации (Мадрид, Рим).\n8\nЯзыковой состав\nГерманская группа (шведы, норвежцы, датчане) + финно-угорская (финны).\nРоманская группа (итальянцы, испанцы, португальцы) + греческая.\n9.\nПриродно-ресурсные особенности\n• Ресурсы: богата лесом (тайга), железными рудами (Швеция), нефтью и газом на шельфе Северного моря (Норвегия).\n• Ресурсы: дефицит топлива и леса; есть руды цветных металлов (ртуть, медь, полиметаллы), сера, мрамор.\n10\nСпециализация сельского хозяйства\nМолочно-мясное скотоводство, кормовые травы, морское рыболовство.\nСубтропическое растениеводство (оливки, цитрусовые, виноград), овцеводство.\n11\nСпециализация промышленности\nЛесная и бумажная, качественная металлургия, хай-тек, судостроение.\nЛёгкая (одежда, обувь), пищевая (вино, масло), автопром, нефтепереработка."}, {"page": 34, "date": "02.11.2026", "title": "Энергетика стран Зарубежной Азии. Практическая работа №10", "source_filename": "IMG_20261124_201901.webp", "captured_at_ms": "2026-11-24 20:19:02.460", "original_webp": "originals/page_34.webp", "blocks": [{"type": "table", "caption": "Электроэнергетика ведущих стран Зарубежной Азии (2025)", "continued_from_prev": false, "continues_to_next": false, "headers": ["Страна", "Объём генерации электроэнергии (2025)", "Доминирующий источник", "Доля низкоуглеродных источников", "Профессиональный акцент для электромонтажника"], "rows": [["Китай", "10 583 ТВт·ч — мировой лидер.", "Уголь (основной)", "~41,7%", "Масштабное строительство сетей и подстанций; участие в проектах АЭС (в т.ч. с «Росатомом»)."], ["Индия", "2082 ТВт·ч", "Уголь", "~26,7%", "Быстрый рост солнечной энергетики; спрос на монтажников СЭС и электриков горнодобывающего сектора."], ["Иран", "396 ТВт·ч", "Природный газ (~80–90)", "~5 (только ГЭС)", "Работа с газовой генерацией и тепловыми станциями; потенциал развития ВИЭ пока невелик."], ["Япония", "1030 ТВт·ч", "Газ (основной)", "~32,7%", "Острый дефицит электриков из-за старения населения; обновление устаревших сетей."]]}, {"type": "marginalia", "text": "02.11.2026"}, {"type": "heading", "level": 1, "text": "Практическая работа №10."}, {"type": "heading", "level": 2, "text": "Тема: Сравнение международной промышленной и сельскохозяйственной специализации Китая и Индии на основе анализа данных об экспорте."}], "uncertain_words": [], "plain_text": "Электроэнергетика ведущих стран Зарубежной Азии (2025)\nСтрана\nОбъём генерации электроэнергии (2025)\nДоминирующий источник\nДоля низкоуглеродных источников\nПрофессиональный акцент для электромонтажника\nКитай\n10 583 ТВт·ч — мировой лидер.\nУголь (основной)\n~41,7%\nМасштабное строительство сетей и подстанций; участие в проектах АЭС (в т.ч. с «Росатомом»).\nИндия\n2082 ТВт·ч\nУголь\n~26,7%\nБыстрый рост солнечной энергетики; спрос на монтажников СЭС и электриков горнодобывающего сектора.\nИран\n396 ТВт·ч\nПриродный газ (~80–90)\n~5 (только ГЭС)\nРабота с газовой генерацией и тепловыми станциями; потенциал развития ВИЭ пока невелик.\nЯпония\n1030 ТВт·ч\nГаз (основной)\n~32,7%\nОстрый дефицит электриков из-за старения населения; обновление устаревших сетей.\n02.11.2026\nПрактическая работа №10.\nТема: Сравнение международной промышленной и сельскохозяйственной специализации Китая и Индии на основе анализа данных об экспорте.", "table_text": "Электроэнергетика ведущих стран Зарубежной Азии (2025)\nСтрана\nОбъём генерации электроэнергии (2025)\nДоминирующий источник\nДоля низкоуглеродных источников\nПрофессиональный акцент для электромонтажника\nКитай\n10 583 ТВт·ч — мировой лидер.\nУголь (основной)\n~41,7%\nМасштабное строительство сетей и подстанций; участие в проектах АЭС (в т.ч. с «Росатомом»).\nИндия\n2082 ТВт·ч\nУголь\n~26,7%\nБыстрый рост солнечной энергетики; спрос на монтажников СЭС и электриков горнодобывающего сектора.\nИран\n396 ТВт·ч\nПриродный газ (~80–90)\n~5 (только ГЭС)\nРабота с газовой генерацией и тепловыми станциями; потенциал развития ВИЭ пока невелик.\nЯпония\n1030 ТВт·ч\nГаз (основной)\n~32,7%\nОстрый дефицит электриков из-за старения населения; обновление устаревших сетей."}, {"page": 35, "date": null, "title": "Практическая работа №10: цель и расчёты по экспорту Китая и Индии", "source_filename": "IMG_20261124_201911.webp", "captured_at_ms": "2026-11-24 20:19:12.368", "original_webp": "originals/page_35.webp", "blocks": [{"type": "paragraph", "text": "Цель занятия: сформировать умения анализировать и сравнивать международную промышленную и сельскохозяйственную специализацию Китая и Индии на основе статистических данных об экспорте, выявлять отрасли, определяющие место стран в международном разделении труда, и устанавливать связь между промышленной специализацией и востребованностью профессии электромонтажника."}, {"type": "heading", "level": 2, "text": "Задания для выполнения."}, {"type": "heading", "level": 2, "text": "Задание."}, {"type": "paragraph", "text": "1. Перевод товарного экспорта Китая в доллары США."}, {"type": "formula", "latex": "26{,}99\\text{ трлн юаней} = 26990\\text{ млрд юаней}", "label": "Перевод трлн юаней в млрд юаней"}, {"type": "formula", "latex": "\\frac{26990}{7{,}2} \\approx 3748{,}6\\text{ млрд долл.}", "label": "Перевод товарного экспорта Китая в доллары США"}, {"type": "paragraph", "text": "2. Сравнение товарного экспорта Китая и Индии (437,7 млрд долл.):"}, {"type": "formula", "latex": "\\frac{3748{,}6}{437{,}7} \\approx 8{,}6\\text{ раза}", "label": "Соотношение товарного экспорта Китая и Индии"}, {"type": "paragraph", "text": "3. Сравнение агроэкспорта и его долей:"}, {"type": "list", "ordered": false, "items": ["Объём агроэкспорта Китая в 2,0 раза больше Индии (104,76 / 52,55 ≈ 2,0)."]}, {"type": "formula", "latex": "\\frac{104{,}76}{52{,}55} \\approx 2{,}0", "label": "Соотношение объёма агроэкспорта Китая и Индии"}, {"type": "list", "ordered": false, "items": ["Доля АПК в товарном экспорте Китая:"]}, {"type": "formula", "latex": "\\frac{104{,}76}{3748{,}6} \\times 100\\% \\approx 2{,}8\\%", "label": "Доля АПК в товарном экспорте Китая"}, {"type": "list", "ordered": false, "items": ["Доля АПК в товарном экспорте Индии:"]}, {"type": "formula", "latex": "\\frac{52{,}55}{437{,}7} \\times 100\\% \\approx 12{,}0\\%", "label": "Доля АПК в товарном экспорте Индии"}], "uncertain_words": [], "plain_text": "Цель занятия: сформировать умения анализировать и сравнивать международную промышленную и сельскохозяйственную специализацию Китая и Индии на основе статистических данных об экспорте, выявлять отрасли, определяющие место стран в международном разделении труда, и устанавливать связь между промышленной специализацией и востребованностью профессии электромонтажника.\nЗадания для выполнения.\nЗадание.\n1. Перевод товарного экспорта Китая в доллары США.\nПеревод трлн юаней в млрд юаней 26{,}99\\text{ трлн юаней} = 26990\\text{ млрд юаней}\nПеревод товарного экспорта Китая в доллары США \\frac{26990}{7{,}2} \\approx 3748{,}6\\text{ млрд долл.}\n2. Сравнение товарного экспорта Китая и Индии (437,7 млрд долл.):\nСоотношение товарного экспорта Китая и Индии \\frac{3748{,}6}{437{,}7} \\approx 8{,}6\\text{ раза}\n3. Сравнение агроэкспорта и его долей:\nОбъём агроэкспорта Китая в 2,0 раза больше Индии (104,76 / 52,55 ≈ 2,0).\nСоотношение объёма агроэкспорта Китая и Индии \\frac{104{,}76}{52{,}55} \\approx 2{,}0\nДоля АПК в товарном экспорте Китая:\nДоля АПК в товарном экспорте Китая \\frac{104{,}76}{3748{,}6} \\times 100\\% \\approx 2{,}8\\%\nДоля АПК в товарном экспорте Индии:\nДоля АПК в товарном экспорте Индии \\frac{52{,}55}{437{,}7} \\times 100\\% \\approx 12{,}0\\%", "table_text": ""}, {"page": 36, "date": null, "title": "Практическая работа №10: таблица специализации Китая и Индии, Задание 3", "source_filename": "IMG_20261124_201956.webp", "captured_at_ms": "2026-11-24 20:19:57.261", "original_webp": "originals/page_36.webp", "blocks": [{"type": "callout", "label": "Вывод", "text": "Китай превосходит Индию по товарному экспорту в 8,6 раза."}, {"type": "heading", "level": 2, "text": "Задание 2. Таблица «Промышленная и сельскохозяйственная специализация Китая и Индии»."}, {"type": "table", "caption": "Промышленная и сельскохозяйственная специализация Китая и Индии", "continued_from_prev": false, "continues_to_next": false, "headers": ["Критерий сравнения", "Китай", "Индия"], "rows": [["Ведущая отрасль пром. экспорта.", "Машиностроение и электроника (60,9% всего экспорта).", "Инженерные товары (>26%), нефтепереработка, электроника (10,8%)."], ["Ключевые пром. товары", "Авто (7,1 млн. шт.), электромобили, роботы, батареи, солнечные модули (249,8 ГВт).", "Смартфоны (30,1 млрд $), дизтопливо (16,3 млрд $), бриллианты (12,5 млрд $), лекарства (10,7 млрд $), бензин (9,7 млрд $)."], ["Ключевой сельскохозяйственный экспорт (объём).", "104,76 млрд долл. (2,8% экспорта).", "52,55 млрд долл. (12,0% экспорта)."], ["Основные статьи сельхозэкспорта.", "Овощи, грибы, морепродукты, фрукты, орехи.", "Рис (11,5 млрд долл. — 21,9% агроэкспорта)."], ["Характер специализации.", "Высокотехнологичный индустриальный.", "Индустриально-аграрный и сервисный (услуги — 387,6 млрд $)."]]}, {"type": "heading", "level": 2, "text": "Задание 3."}, {"type": "list", "ordered": false, "items": ["Китай (Мировая фабрика):"]}, {"type": "list", "ordered": true, "items": ["60,9% гигантского экспорта (3748,6 млрд долларов) — машины, оборудование и электроника.", "1 место в мире по экспорту авто (7,098 млн шт.) и нетто-экспортёр пром. роботов (+48,7%)."]}], "uncertain_words": [], "plain_text": "Вывод: Китай превосходит Индию по товарному экспорту в 8,6 раза.\nЗадание 2. Таблица «Промышленная и сельскохозяйственная специализация Китая и Индии».\nПромышленная и сельскохозяйственная специализация Китая и Индии\nКритерий сравнения\nКитай\nИндия\nВедущая отрасль пром. экспорта.\nМашиностроение и электроника (60,9% всего экспорта).\nИнженерные товары (>26%), нефтепереработка, электроника (10,8%).\nКлючевые пром. товары\nАвто (7,1 млн. шт.), электромобили, роботы, батареи, солнечные модули (249,8 ГВт).\nСмартфоны (30,1 млрд $), дизтопливо (16,3 млрд $), бриллианты (12,5 млрд $), лекарства (10,7 млрд $), бензин (9,7 млрд $).\nКлючевой сельскохозяйственный экспорт (объём).\n104,76 млрд долл. (2,8% экспорта).\n52,55 млрд долл. (12,0% экспорта).\nОсновные статьи сельхозэкспорта.\nОвощи, грибы, морепродукты, фрукты, орехи.\nРис (11,5 млрд долл. — 21,9% агроэкспорта).\nХарактер специализации.\nВысокотехнологичный индустриальный.\nИндустриально-аграрный и сервисный (услуги — 387,6 млрд $).\nЗадание 3.\nКитай (Мировая фабрика):\n60,9% гигантского экспорта (3748,6 млрд долларов) — машины, оборудование и электроника.\n1 место в мире по экспорту авто (7,098 млн шт.) и нетто-экспортёр пром. роботов (+48,7%).", "table_text": "Промышленная и сельскохозяйственная специализация Китая и Индии\nКритерий сравнения\nКитай\nИндия\nВедущая отрасль пром. экспорта.\nМашиностроение и электроника (60,9% всего экспорта).\nИнженерные товары (>26%), нефтепереработка, электроника (10,8%).\nКлючевые пром. товары\nАвто (7,1 млн. шт.), электромобили, роботы, батареи, солнечные модули (249,8 ГВт).\nСмартфоны (30,1 млрд $), дизтопливо (16,3 млрд $), бриллианты (12,5 млрд $), лекарства (10,7 млрд $), бензин (9,7 млрд $).\nКлючевой сельскохозяйственный экспорт (объём).\n104,76 млрд долл. (2,8% экспорта).\n52,55 млрд долл. (12,0% экспорта).\nОсновные статьи сельхозэкспорта.\nОвощи, грибы, морепродукты, фрукты, орехи.\nРис (11,5 млрд долл. — 21,9% агроэкспорта).\nХарактер специализации.\nВысокотехнологичный индустриальный.\nИндустриально-аграрный и сервисный (услуги — 387,6 млрд $)."}, {"page": 37, "date": null, "title": "Индия (мировая аптека и аграрная держава)", "source_filename": "IMG_20261124_202010.webp", "captured_at_ms": "2026-11-24 20:20:11.161", "original_webp": "originals/page_37.webp", "blocks": [{"type": "heading", "level": 2, "text": "Индия (мировая аптека и аграрная держава)."}, {"type": "list", "ordered": true, "items": ["Фармацевтика — 4-я статья экспорта страны (10,7 млрд. долл).", "Высокая доля АПК в товарном экспорте (12,0% против 2,8% у Китая), при этом ускоренная индустриализация и электрификация формируют высокий спрос на электрооборудование."]}, {"type": "marginalia", "text": "4 з/"}], "uncertain_words": [], "plain_text": "Индия (мировая аптека и аграрная держава).\nФармацевтика — 4-я статья экспорта страны (10,7 млрд. долл).\nВысокая доля АПК в товарном экспорте (12,0% против 2,8% у Китая), при этом ускоренная индустриализация и электрификация формируют высокий спрос на электрооборудование.\n4 з/", "table_text": ""}, {"page": 38, "date": "03.11.2026", "title": "Америка. Северная Америка. Южная Америка", "source_filename": "IMG_20261124_202120.webp", "captured_at_ms": "2026-11-24 20:21:21.637", "original_webp": "originals/page_38.webp", "blocks": [{"type": "heading", "level": 1, "text": "Америка. Северная Америка. Южная Америка."}, {"type": "definition", "term": "Америка", "text": "это часть света, которая охватывает 2 материка, это Южная и Северная Америка и прилегающие острова."}, {"type": "paragraph", "text": "В экономической и социальной географии принято выделять 2 крупных субрегиона, которые различаются по историческим, культурным и социально-экономическим признакам:"}, {"type": "paragraph", "text": "Северная Америка. Сюда входят: США. Это высокоразвитые страны Большой семёрки с преобладанием английского языка и с протестантской культурой."}, {"type": "paragraph", "text": "Латинская Америка включает: Мексику, страны Центральной и Южной Америки, а также страны Карибского бассейна. Это регион с испанским и португальским колониальным наследием, с преимущественно с католической культурой и со значительно высоким уровнем социально-экономического развития."}, {"type": "paragraph", "text": "Большая часть Латинской Америки принадлежит США, которая оказывает определяющее влияние на хозяйственные и политические процессы, так и Латинской, как и Южной."}, {"type": "heading", "level": 2, "text": "Экономико-географическое положение и природно-ресурсный капитал."}, {"type": "paragraph", "text": "США и Канада обладают выгодно-"}], "uncertain_words": [], "plain_text": "Америка. Северная Америка. Южная Америка.\nАмерика — это часть света, которая охватывает 2 материка, это Южная и Северная Америка и прилегающие острова.\nВ экономической и социальной географии принято выделять 2 крупных субрегиона, которые различаются по историческим, культурным и социально-экономическим признакам:\nСеверная Америка. Сюда входят: США. Это высокоразвитые страны Большой семёрки с преобладанием английского языка и с протестантской культурой.\nЛатинская Америка включает: Мексику, страны Центральной и Южной Америки, а также страны Карибского бассейна. Это регион с испанским и португальским колониальным наследием, с преимущественно с католической культурой и со значительно высоким уровнем социально-экономического развития.\nБольшая часть Латинской Америки принадлежит США, которая оказывает определяющее влияние на хозяйственные и политические процессы, так и Латинской, как и Южной.\nЭкономико-географическое положение и природно-ресурсный капитал.\nСША и Канада обладают выгодно-", "table_text": ""}, {"page": 39, "date": "10.11.26", "title": "ЭГП Америки (продолжение) и геополитическое положение России", "source_filename": "IMG_20261124_202135.webp", "captured_at_ms": "2026-11-24 20:21:36.570", "original_webp": "originals/page_39.webp", "blocks": [{"type": "paragraph", "text": "экономико-географическим положением."}, {"type": "paragraph", "text": "Латинская Америка также обладает колоссальным ресурсно-капитальным объёмом. {{?Характерно}}"}, {"type": "heading", "level": 2, "text": "На примере США, Канады, Мексики."}, {"type": "paragraph", "text": "Канада — крупный производитель гидроэлектроэнергии. Канадские компании являются значимыми поставщиками электроэнергии и оборудования в США."}, {"type": "paragraph", "text": "США — один из мировых лидеров по производству электротехнического оборудования, систем автоматизации и кабельной продукции."}, {"type": "marginalia", "text": "10.11.26."}, {"type": "definition", "term": "Россия", "text": "это крупнейшая страна мира (17,1 млн км²), занимающая восточную часть Европы и северную часть Азии."}, {"type": "paragraph", "text": "Геополитическое положение определяется не только размером территории, но и характером границ. На северо-западе Россия граничит по суше с Финляндией и Норвегией. На западе с Белоруссией и Украиной. На юге с Грузией, Азербайджаном."}, {"type": "paragraph", "text": "Западное направление после 2022 года стало зоной повышенной напряжённости."}, {"type": "paragraph", "text": "Южное и южно-восточное направление рас-"}], "uncertain_words": [{"word": "Характерно", "context": "Латинская Америка также обладает колоссальным ресурсно-капитальным объёмом. {{?Характерно}}"}], "plain_text": "экономико-географическим положением.\nЛатинская Америка также обладает колоссальным ресурсно-капитальным объёмом. {{?Характерно}}\nНа примере США, Канады, Мексики.\nКанада — крупный производитель гидроэлектроэнергии. Канадские компании являются значимыми поставщиками электроэнергии и оборудования в США.\nСША — один из мировых лидеров по производству электротехнического оборудования, систем автоматизации и кабельной продукции.\n10.11.26.\nРоссия — это крупнейшая страна мира (17,1 млн км²), занимающая восточную часть Европы и северную часть Азии.\nГеополитическое положение определяется не только размером территории, но и характером границ. На северо-западе Россия граничит по суше с Финляндией и Норвегией. На западе с Белоруссией и Украиной. На юге с Грузией, Азербайджаном.\nЗападное направление после 2022 года стало зоной повышенной напряжённости.\nЮжное и южно-восточное направление рас-", "table_text": ""}, {"page": 40, "date": null, "title": "Геоэкономическое и демографическое положение России, ШОС и сравнительная таблица стран", "source_filename": "IMG_20261124_202149.webp", "captured_at_ms": "2026-11-24 20:21:50.035", "original_webp": "originals/page_40.webp", "blocks": [{"type": "paragraph", "text": "сматриваются как плацдарм для расширения экономического пространства."}, {"type": "paragraph", "text": "Геоэкономическое положение России носит двойственный характер: по ВВП по паритету покупательной способности Россия по итогам 2025 года входит в четвёрку крупнейших экономик мира, но сохраняет зависимость от экспорта сырья и перестройки логистики."}, {"type": "paragraph", "text": "С другой стороны темп роста остаётся низким, в 2025 года экономика выросла менее чем на {{?1,1%}}. Прогноз МВФ — Международный валютный фонд, согласно на 2026 год. В номинальном выражении Россия уступает ведущим экономикам."}, {"type": "paragraph", "text": "Демографическое положение: на 1 января 2025 года население России составило 146,1 млн человек (9-е место в мире по численности населения)."}, {"type": "paragraph", "text": "За 2025 год население сократилось за счёт естественной убыли (превышения смертности над рождаемостью), частично компенсируемой миграционным притоком."}, {"type": "definition", "term": "{{?Шанхай}}", "text": "это международное интеграционное объединение, созданное для углубления экономического сотрудничества. Сюда входят Казахстан, Китай, Кыргызстан, Индия, Россия, Пакистан, Россия, Беларусь, Таджикистан, Узбекистан."}, {"type": "paragraph", "text": "{{?Шанхайская}} межгосударственная {{?крупная}} организация."}, {"type": "table", "caption": "Сравнение экономических и демографических показателей стран", "continued_from_prev": false, "continues_to_next": false, "headers": ["Показатель", "РФ", "Китай", "Индия", "Казахстан"], "rows": [["ВВП по ППС", "7,53 трлн $ (4-е место)", "44,30 трлн $ (1-е место)", "18,90 трлн $ (3-е место)", "1,00 трлн $ (35-е место)"], ["ВВП по ППС на душу населения.", "~52,5 тыс. $", "~31,6 тыс. $", "~12,8 тыс. $", "~48,7 тыс. $"], ["Население, млн. чел.", "143,4–146,0 млн. (9-е место)", "1 412,9 млн (2-е место)", "1 476,6 млн (1-е место)", "20,8 млн (~62-е место)."]]}], "uncertain_words": [{"word": "носит", "context": "Геоэкономическое положение {{?носит}} России двойственный"}, {"word": "1,1%", "context": "в 2025 года экономика выросла менее чем на {{?1,1%}}"}, {"word": "Шанхай", "context": "{{?Шанхай}} — это международное интеграционное объединение"}, {"word": "Шанхайская", "context": "{{?Шанхайская}} межгосударственная {{?крупная}} организация."}, {"word": "крупная", "context": "{{?Шанхайская}} межгосударственная {{?крупная}} организация."}], "plain_text": "сматриваются как плацдарм для расширения экономического пространства.\nГеоэкономическое положение России носит двойственный характер: по ВВП по паритету покупательной способности Россия по итогам 2025 года входит в четвёрку крупнейших экономик мира, но сохраняет зависимость от экспорта сырья и перестройки логистики.\nС другой стороны темп роста остаётся низким, в 2025 года экономика выросла менее чем на {{?1,1%}}. Прогноз МВФ — Международный валютный фонд, согласно на 2026 год. В номинальном выражении Россия уступает ведущим экономикам.\nДемографическое положение: на 1 января 2025 года население России составило 146,1 млн человек (9-е место в мире по численности населения).\nЗа 2025 год население сократилось за счёт естественной убыли (превышения смертности над рождаемостью), частично компенсируемой миграционным притоком.\n{{?Шанхай}} — это международное интеграционное объединение, созданное для углубления экономического сотрудничества. Сюда входят Казахстан, Китай, Кыргызстан, Индия, Россия, Пакистан, Россия, Беларусь, Таджикистан, Узбекистан.\n{{?Шанхайская}} межгосударственная {{?крупная}} организация.\nСравнение экономических и демографических показателей стран\nПоказатель\nРФ\nКитай\nИндия\nКазахстан\nВВП по ППС\n7,53 трлн $ (4-е место)\n44,30 трлн $ (1-е место)\n18,90 трлн $ (3-е место)\n1,00 трлн $ (35-е место)\nВВП по ППС на душу населения.\n~52,5 тыс. $\n~31,6 тыс. $\n~12,8 тыс. $\n~48,7 тыс. $\nНаселение, млн. чел.\n143,4–146,0 млн. (9-е место)\n1 412,9 млн (2-е место)\n1 476,6 млн (1-е место)\n20,8 млн (~62-е место).", "table_text": "Сравнение экономических и демографических показателей стран\nПоказатель\nРФ\nКитай\nИндия\nКазахстан\nВВП по ППС\n7,53 трлн $ (4-е место)\n44,30 трлн $ (1-е место)\n18,90 трлн $ (3-е место)\n1,00 трлн $ (35-е место)\nВВП по ППС на душу населения.\n~52,5 тыс. $\n~31,6 тыс. $\n~12,8 тыс. $\n~48,7 тыс. $\nНаселение, млн. чел.\n143,4–146,0 млн. (9-е место)\n1 412,9 млн (2-е место)\n1 476,6 млн (1-е место)\n20,8 млн (~62-е место)."}, {"page": 41, "date": "12.11.26", "title": "Практическая работа № 13: Изменение направления международных экономических связей России", "source_filename": "IMG_20261124_202203.webp", "captured_at_ms": "2026-11-24 20:22:04.471", "original_webp": "originals/page_41.webp", "blocks": [{"type": "heading", "level": 1, "text": "Практическая работа № 13"}, {"type": "callout", "label": "Тема", "text": "«Изменение направления международных экономических связей России в новых геоэкономических и геополитических условиях»."}, {"type": "callout", "label": "Цель работы", "text": "научиться анализировать направления международных экономических связей России в условиях изменения геополитической ситуации, выявлять географические сдвиги во внешней торговле и определять место профильной отрасли (электроэнергетики и электротехнического машиностроения) в новой системе."}, {"type": "heading", "level": 2, "text": "Задание 1."}, {"type": "table", "caption": "Исходные данные для анализа:", "continued_from_prev": false, "continues_to_next": false, "headers": ["Регион / группа стран", "Доля в товарообороте, 2025 г.", "Доля в товарообороте, первое полугодие 2026 г."], "rows": [["Страны Глобального Юга", "Около 75%", "Около 76%"], ["Азиатско-Тихоокеанский регион", "44,8%", "48,6%"], ["Европа (включая ЕС)", "18,6% (доля в торговле)", "Резкое снижение доли после 2022 г. из-за санкций."], ["Дружественные страны", "85%", "Устойчивый рост; основа современной внешней торговли РФ."]]}, {"type": "heading", "level": 2, "text": "Вопросы:"}, {"type": "list", "ordered": true, "items": ["Страны Глобального Юга (около 76%), дружественные страны (85%) и Азиатско-Тихоокеанский регион — АТР (48,6%)."]}], "uncertain_words": [], "plain_text": "Практическая работа № 13\nТема: «Изменение направления международных экономических связей России в новых геоэкономических и геополитических условиях».\nЦель работы: научиться анализировать направления международных экономических связей России в условиях изменения геополитической ситуации, выявлять географические сдвиги во внешней торговле и определять место профильной отрасли (электроэнергетики и электротехнического машиностроения) в новой системе.\nЗадание 1.\nИсходные данные для анализа:\nРегион / группа стран\nДоля в товарообороте, 2025 г.\nДоля в товарообороте, первое полугодие 2026 г.\nСтраны Глобального Юга\nОколо 75%\nОколо 76%\nАзиатско-Тихоокеанский регион\n44,8%\n48,6%\nЕвропа (включая ЕС)\n18,6% (доля в торговле)\nРезкое снижение доли после 2022 г. из-за санкций.\nДружественные страны\n85%\nУстойчивый рост; основа современной внешней торговли РФ.\nВопросы:\nСтраны Глобального Юга (около 76%), дружественные страны (85%) и Азиатско-Тихоокеанский регион — АТР (48,6%).", "table_text": "Исходные данные для анализа:\nРегион / группа стран\nДоля в товарообороте, 2025 г.\nДоля в товарообороте, первое полугодие 2026 г.\nСтраны Глобального Юга\nОколо 75%\nОколо 76%\nАзиатско-Тихоокеанский регион\n44,8%\n48,6%\nЕвропа (включая ЕС)\n18,6% (доля в торговле)\nРезкое снижение доли после 2022 г. из-за санкций.\nДружественные страны\n85%\nУстойчивый рост; основа современной внешней торговли РФ."}, {"page": 42, "date": null, "title": "Практическая работа № 13 (продолжение): Задания 1–3", "source_filename": "IMG_20261124_202211.webp", "captured_at_ms": "2026-11-24 20:22:11.698", "original_webp": "originals/page_42.webp", "blocks": [{"type": "paragraph", "text": "2. Крупнейший партнёр России: Китай (товарооборот по итогам 2025 г. составил около 220–239 млрд. долл, или почти треть всей внешней торговли РФ)."}, {"type": "paragraph", "text": "3. Доля Европы и причины изменений. Резко сократилась (до 18,6% в 2025 г.) из-за западных санкций, разрыва логистических цепочек и переориентации России на рынки Азии и Глобального Юга."}, {"type": "callout", "label": "Общий вывод к заданию 1", "text": "Позиции стран Азии (АТР) и Глобального Юга значительно усилились, компенсировав падение торговли с Европой."}, {"type": "heading", "level": 2, "text": "Задание 2."}, {"type": "paragraph", "text": "1. Доля минеральной продукции. Около 54% (225 млрд. долл в 2025 г.) в динамике её доля постепенно снижается на фоне роста готовой продукции."}, {"type": "paragraph", "text": "2. Расчёт доли несырьевого неэнергетического экспорта (ННЭ):"}, {"type": "formula", "latex": "\\frac{163,6}{418,3} \\times 100\\% \\approx 39,1\\%", "label": "Доля несырьевого неэнергетического экспорта (ННЭ)"}, {"type": "paragraph", "text": "3. Отрасли роста ННЭ. Машиностроение (включая энергетическое), химическая промышленность (удобрения), металлургия и агропромышленный комплекс (АПК)."}, {"type": "callout", "label": "Вывод", "text": "Экспорт РФ диверсифицируется, сырьевая зависимость падает."}, {"type": "heading", "level": 2, "text": "Задание 3."}], "uncertain_words": [], "plain_text": "2. Крупнейший партнёр России: Китай (товарооборот по итогам 2025 г. составил около 220–239 млрд. долл, или почти треть всей внешней торговли РФ).\n3. Доля Европы и причины изменений. Резко сократилась (до 18,6% в 2025 г.) из-за западных санкций, разрыва логистических цепочек и переориентации России на рынки Азии и Глобального Юга.\nОбщий вывод к заданию 1: Позиции стран Азии (АТР) и Глобального Юга значительно усилились, компенсировав падение торговли с Европой.\nЗадание 2.\n1. Доля минеральной продукции. Около 54% (225 млрд. долл в 2025 г.) в динамике её доля постепенно снижается на фоне роста готовой продукции.\n2. Расчёт доли несырьевого неэнергетического экспорта (ННЭ):\nДоля несырьевого неэнергетического экспорта (ННЭ) \\frac{163,6}{418,3} \\times 100\\% \\approx 39,1\\%\n3. Отрасли роста ННЭ. Машиностроение (включая энергетическое), химическая промышленность (удобрения), металлургия и агропромышленный комплекс (АПК).\nВывод: Экспорт РФ диверсифицируется, сырьевая зависимость падает.\nЗадание 3.", "table_text": ""}, {"page": 43, "date": null, "title": "Практическая работа № 13 (окончание) и современный геополитический ландшафт", "source_filename": "IMG_20261124_202221.webp", "captured_at_ms": "2026-11-24 20:22:21.759", "original_webp": "originals/page_43.webp", "blocks": [{"type": "list", "ordered": true, "items": ["Продукция: Трансформаторы, высоковольтное и вакуумное оборудование, кондиционеры, запчасти.", "Страны: Индия, Турция, Казахстан, Беларусь, Алжир.", "Пример проекта: АЭС «Аккую»."]}, {"type": "heading", "level": 2, "text": "Задание 4."}, {"type": "paragraph", "text": "1. Влияние на рынок труда:"}, {"type": "list", "ordered": false, "items": ["Растёт спрос на электромонтажников из-за масштабного импортозамещения, строительства новых энергообъектов и модернизации электросетей на восточном и южном направлениях.", "Вывод: переориентация внешних связей РФ на Восток и Глобальный Юг стимулирует отечественное электромашиностроение и повышает востребованность профессии электромонтажника."]}, {"type": "marginalia", "text": "4 з/"}, {"type": "paragraph", "text": "Современный геополитический ландшафт характеризуется ослаблением многосторонности."}, {"type": "paragraph", "text": "В конце двадцатого {{?на начало года}}: Проблема разрыва в уровне социально-экономического развития имеет структурные причины: Это технологическая зависимость, слабость институтов."}, {"type": "paragraph", "text": "в 33,2%. — за этой цифрой скрыта глубокая дифференциация. Развитые экономики сталкиваются. Недостаток рабочих мест и создание рабочих мест где они нужнее всего, слабое управление и недостаточная правоприменительная способность более распространённое в развивающихся экономиках снижают {{?фискальные правила}}."}, {"type": "paragraph", "text": "Для электромонтажника геополитическая проблема имеет прямое следствие — это энергетическая безопасность."}], "uncertain_words": [{"word": "на начало года", "context": "В конце двадцатого {{?на начало года}}:"}, {"word": "фискальные правила", "context": "в развивающихся экономиках снижают {{?фискальные правила}}."}], "plain_text": "Продукция: Трансформаторы, высоковольтное и вакуумное оборудование, кондиционеры, запчасти.\nСтраны: Индия, Турция, Казахстан, Беларусь, Алжир.\nПример проекта: АЭС «Аккую».\nЗадание 4.\n1. Влияние на рынок труда:\nРастёт спрос на электромонтажников из-за масштабного импортозамещения, строительства новых энергообъектов и модернизации электросетей на восточном и южном направлениях.\nВывод: переориентация внешних связей РФ на Восток и Глобальный Юг стимулирует отечественное электромашиностроение и повышает востребованность профессии электромонтажника.\n4 з/\nСовременный геополитический ландшафт характеризуется ослаблением многосторонности.\nВ конце двадцатого {{?на начало года}}: Проблема разрыва в уровне социально-экономического развития имеет структурные причины: Это технологическая зависимость, слабость институтов.\nв 33,2%. — за этой цифрой скрыта глубокая дифференциация. Развитые экономики сталкиваются. Недостаток рабочих мест и создание рабочих мест где они нужнее всего, слабое управление и недостаточная правоприменительная способность более распространённое в развивающихся экономиках снижают {{?фискальные правила}}.\nДля электромонтажника геополитическая проблема имеет прямое следствие — это энергетическая безопасность.", "table_text": ""}, {"page": 44, "date": null, "title": "Глобальные проблемы современности: вопросы и ответы", "source_filename": "IMG_20261124_202227.webp", "captured_at_ms": "2026-11-24 20:22:27.883", "original_webp": "originals/page_44.webp", "blocks": [{"type": "marginalia", "text": "{{?Геополитика}} 3"}, {"type": "paragraph", "text": "За историю наблюдений температура поднялась более чем на 1,5°C выше доиндустриального уровня. Глобальные климатические изменения проявляются в учащении экстремальных погодных явлений, таянии ледников и росте уровня Мирового океана."}, {"type": "list", "ordered": true, "items": ["Почему геополитическая нестабильность 2020-х годов называют системным фактором для всех остальных глобальных проблем.", "В чём различие между исчерпанием ресурсов и современной энергетической проблемой.", "Почему потеря биоразнообразия и загрязнение океана рассматриваются как единое (тройной планетарный кризис)?"]}, {"type": "list", "ordered": true, "items": ["Конфликты разрушают международное сотрудничество и перетягивают деньги на оборону, блокируя решение остальных глобальных проблем.", "Исчерпание — это физическая нехватка ресурсов в природе, а современная энергопроблема — сложность перехода на «зелёную» энергию и сбои поставок при наличии топлива.", "Изменение климата, загрязнение (пластик, стоки, выбросы) и потеря биоразнообразия взаимно усиливают друг друга: деградация экосистем океана и суши снижает способность планеты поглощать CO₂ и поддерживать устойчивость биосферы."]}, {"type": "marginalia", "text": "3 з/"}], "uncertain_words": [{"word": "Геополитика", "context": "{{?Геополитика}} 3 (надпись в верхнем левом углу)"}], "plain_text": "{{?Геополитика}} 3\nЗа историю наблюдений температура поднялась более чем на 1,5°C выше доиндустриального уровня. Глобальные климатические изменения проявляются в учащении экстремальных погодных явлений, таянии ледников и росте уровня Мирового океана.\nПочему геополитическая нестабильность 2020-х годов называют системным фактором для всех остальных глобальных проблем.\nВ чём различие между исчерпанием ресурсов и современной энергетической проблемой.\nПочему потеря биоразнообразия и загрязнение океана рассматриваются как единое (тройной планетарный кризис)?\nКонфликты разрушают международное сотрудничество и перетягивают деньги на оборону, блокируя решение остальных глобальных проблем.\nИсчерпание — это физическая нехватка ресурсов в природе, а современная энергопроблема — сложность перехода на «зелёную» энергию и сбои поставок при наличии топлива.\nИзменение климата, загрязнение (пластик, стоки, выбросы) и потеря биоразнообразия взаимно усиливают друг друга: деградация экосистем океана и суши снижает способность планеты поглощать CO₂ и поддерживать устойчивость биосферы.\n3 з/", "table_text": ""}];

(function () {

    { id: "tables", name: "Таблицы", color: "#1E9E63" },

  ];

  const SafeLS = {

    },
    set(key, val) {

  const LocalDB = {
    db: null,

          req.onerror = () => resolve(null);

      });
    },
    async get(key) {
      if (!this.db) return null;
      return new Promise((resolve) => {
        try {
          const tx = this.db.transaction(IDB_STORE, "readonly");
          const req = tx.objectStore(IDB_STORE).get(key);
          req.onsuccess = () => resolve(req.result ?? null);
          req.onerror = () => resolve(null);
        } catch (_) { resolve(null); }
      });
    },
    async set(key, val) {

          tx.oncomplete = () => resolve(true);

    }
  };

  const state = {

    theme: "light",         // light | warm | oled

    highlights: {},
    edits: {},
    wordFixes: {},

    activeSheet: null,
    navTab: "toc",
    searchQuery: "",
    searchFilter: "all",
    activeSearchTerm: "",
    matchIndex: 0,

  };

  // =========================================================================
  // Helpers: Russian Normalization, Fuzzy Search, Balanced LaTeX Parser
  // =========================================================================
  function normRu(str) {
    return String(str || "").toLowerCase().replace(/ё/g, "е").replace(/\s+/g, " ").trim();
  }

  function escapeHtml(s) {
    return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function levenshtein(a, b) {
    if (a === b) return 0;
    if (!a.length) return b.length;
    if (!b.length) return a.length;
    if (Math.abs(a.length - b.length) > 2) return 3;
    const prev = Array.from({ length: b.length + 1 }, (_, i) => i);
    for (let i = 1; i <= a.length; i++) {
      const curr = [i];
      for (let j = 1; j <= b.length; j++) {
        const cost = a[i - 1] === b[j - 1] ? 0 : 1;
        curr[j] = Math.min(curr[j - 1] + 1, prev[j] + 1, prev[j - 1] + cost);
      }
      for (let j = 0; j <= b.length; j++) prev[j] = curr[j];
    }
    return prev[b.length];
  }

  function readBraceGroup(str, startIdx) {
    if (str[startIdx] !== "{") return null;

    for (let i = startIdx; i < str.length; i++) {

      else if (str[i] === "}") {
        depth--;
        if (depth === 0) return { content: str.slice(startIdx + 1, i), nextIdx: i + 1 };
      }
    }
    return null;
  }

  function parseLatexSegment(raw) {
    let s = String(raw || "").replace(/\{,\}/g, ",").replace(/\\left/g, "").replace(/\\right/g, "").replace(/\\displaystyle/g, "");
    let out = "";
    let i = 0;
    while (i < s.length) {
      if (s[i] === "\\") {
        const cmdMatch = s.slice(i + 1).match(/^([a-zA-Z]+|[^a-zA-Z\s])/);
        if (!cmdMatch) { i++; continue; }
        const cmd = cmdMatch[1];
        i += 1 + cmd.length;
        if (cmd === "frac") {
          while (s[i] === " ") i++;
          const num = readBraceGroup(s, i);
          if (num) {
            i = num.nextIdx;
            while (s[i] === " ") i++;
            const den = readBraceGroup(s, i);
            if (den) {
              i = den.nextIdx;
              out += `<span class="math-frac"><span class="math-num">${parseLatexSegment(num.content)}</span><span class="math-den">${parseLatexSegment(den.content)}</span></span>`;
              continue;
            }
          }
        } else if (cmd === "text" || cmd === "mathrm" || cmd === "textbf") {
          while (s[i] === " ") i++;
          const grp = readBraceGroup(s, i);
          if (grp) {
            i = grp.nextIdx;
            out += `<span class="math-text" style="${cmd === "textbf" ? "font-weight:700" : ""}">${escapeHtml(grp.content)}</span>`;
            continue;
          }
        } else if (cmd === "sqrt") {
          while (s[i] === " ") i++;
          const grp = readBraceGroup(s, i);
          if (grp) { i = grp.nextIdx; out += `√(${parseLatexSegment(grp.content)})`; continue; }
        } else {
          const symMap = {
            times: "×", cdot: "·", approx: "≈", pm: "±", le: "≤", ge: "≥", leq: "≤", geq: "≥", neq: "≠",
            Rightarrow: "⇒", to: "→", rightarrow: "→", Delta: "Δ", alpha: "α", beta: "β", gamma: "γ", pi: "π", omega: "ω",
            "%": "%", ",": " ", ";": " ", ":": " ", quad: "  ", qquad: "   "
          };
          out += symMap[cmd] !== undefined ? symMap[cmd] : "";
          continue;

        i++;
        if (s[i] === "{") {

          if (grp) { i = grp.nextIdx; out += `<${tag}>${parseLatexSegment(grp.content)}</${tag}>`; continue; }

      }

  }

  function renderLatexToHtml(latex) {
    return '<span class="math-expr">' + parseLatexSegment(latex) + "</span>";

  function vibrate(ms) {

    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (_) {}
  }

  function copyText(text, successMsg) {
    const done = () => showToast(successMsg || "Скопировано в буфер обмена");
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else fallbackCopy(text, done);
  }

  function fallbackCopy(text, cb) {
    try {

      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); cb();
    } catch (_) { showToast("Не удалось скопировать текст"); }
  }

  let toastTimer = null;
  function showToast(msg) {
    const el = document.getElementById("toast");
    if (!el) return;

    toastTimer = setTimeout(() => el.classList.remove("show"), 2200);

  function getTagById(id) { return allTags().find((t) => t.id === id) || DEFAULT_TAGS[0]; }

  // =========================================================================

  // Survives reloads on http/https, file://, mobile Safari/Chrome, and sandboxed frames!
  // =========================================================================
  const WNAME_PREFIX = "__TETRAD_KONSPEKT_V2__:";
  let lastSavedTs = 0;

  function buildPersistedSnapshot() {
    lastSavedTs = Date.now();
    return {
      updatedAt: lastSavedTs,
      currentPage: state.currentPage,
      scrollPositions: state.scrollPositions,
      theme: state.theme,
      ruling: state.ruling,
      fontSize: state.fontSize,
      lineHeight: state.lineHeight,
      compact: state.compact,
      dimness: state.dimness,
      hudCollapsed: state.hudCollapsed,
      autoHideHud: state.autoHideHud,
      tapZones: state.tapZones,
      swipeEnabled: state.swipeEnabled,
      turnAnim: state.turnAnim,
      focusRuler: state.focusRuler,
      reducedFx: state.reducedFx,
      haptics: state.haptics,
      bookmarks: state.bookmarks,
      customTags: state.customTags,
      notes: state.notes,
      highlights: state.highlights,
      edits: state.edits,
      wordFixes: state.wordFixes,
      searchHistory: state.searchHistory
    };
  }

  function syncUrlHash() {
    try {
      const y = Math.round(Number(state.scrollPositions[state.currentPage]) || 0);
      const params = new URLSearchParams();
      params.set("p", String(state.currentPage));
      if (y > 0) params.set("y", String(y));

      params.set("r", state.ruling);
      params.set("fs", String(state.fontSize));

      if (window.location.hash !== hash) {

      if (params.has("fr")) out.focusRuler = params.get("fr") === "1";

  }

  function saveWindowName(snap) {
