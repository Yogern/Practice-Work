<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>Геометрия 10 • Перпендикулярность прямых и плоскостей (5++)</title>

  <!-- KaTeX CDN для эталонной академической типографики формул -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --grid-size: 24px;
      --spring-smooth: cubic-bezier(0.22, 1, 0.36, 1);
      --spring-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);

      /* Light Mode (iOS 18 Daylight Frosted Glass) */
      --bg-base: #eef2ff;
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --accent-blue: #007aff;
      --accent-indigo: #5856d6;
      --accent-emerald: #10b981;

      --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.62) 0%, rgba(255, 255, 255, 0.28) 100%);
      --glass-pill-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.52) 0%, rgba(255, 255, 255, 0.24) 100%);
      --glass-active-pill: linear-gradient(135deg, rgba(255, 255, 255, 0.92) 0%, rgba(255, 255, 255, 0.68) 100%);
      --glass-border: rgba(255, 255, 255, 0.68);
      --glass-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.9), 0 20px 42px -15px rgba(15, 23, 42, 0.14);

      /* Российская тетрадь в клетку (Светлая тема) */
      --notebook-paper: rgba(252, 253, 255, 0.82);
      --notebook-line: rgba(0, 145, 255, 0.22);
      --notebook-line-major: rgba(0, 145, 255, 0.34);
      --notebook-margin: rgba(255, 59, 48, 0.36);

      /* Цвета чертежа (гелевая ручка / карандаш) */
      --stroke-main: #172554;
      --stroke-aux: #0284c7;
      --stroke-accent: #dc2626;
      --plane-fill-1: rgba(14, 165, 233, 0.12);
      --plane-fill-2: rgba(99, 102, 241, 0.12);
      --vertex-dot: #1e3a8a;
    }

    [data-theme="dark"] {
      --bg-base: #070913;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-indigo: #818cf8;
      --accent-emerald: #34d399;

      --glass-bg: linear-gradient(135deg, rgba(30, 41, 59, 0.62) 0%, rgba(15, 23, 42, 0.38) 100%);
      --glass-pill-bg: linear-gradient(135deg, rgba(30, 41, 59, 0.65) 0%, rgba(15, 23, 42, 0.42) 100%);
      --glass-active-pill: linear-gradient(135deg, rgba(56, 189, 248, 0.32) 0%, rgba(99, 102, 241, 0.26) 100%);
      --glass-border: rgba(255, 255, 255, 0.18);
      --glass-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.22), 0 22px 46px -15px rgba(0, 0, 0, 0.55);

      /* Российская тетрадь в клетку (Темная тема) */
      --notebook-paper: rgba(18, 22, 32, 0.68);
      --notebook-line: rgba(56, 189, 248, 0.18);
      --notebook-line-major: rgba(56, 189, 248, 0.30);
      --notebook-margin: rgba(248, 113, 113, 0.35);

      /* Цвета чертежа в темной теме */
      --stroke-main: #e2e8f0;
      --stroke-aux: #38bdf8;
      --stroke-accent: #fb7185;
      --plane-fill-1: rgba(56, 189, 248, 0.14);
      --plane-fill-2: rgba(129, 140, 248, 0.14);
      --vertex-dot: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      background-color: var(--bg-base);
      color: var(--text-primary);
      line-height: 1.5;
      transition: background-color 0.5s var(--spring-smooth), color 0.4s var(--spring-smooth);
    }

    /* Живой меш-градиент фон (Apple iOS 18 Wallpaper) */
    .ambient-wallpaper {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(75px);
      opacity: 0.65;
      animation: floatOrb 18s infinite alternate ease-in-out;
    }

    [data-theme="dark"] .orb {
      opacity: 0.36;
    }

    .orb-1 {
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, #60a5fa 0%, #3b82f6 65%, transparent 100%);
      top: -100px;
      left: -80px;
    }

    .orb-2 {
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, #c084fc 0%, #8b5cf6 65%, transparent 100%);
      top: 25%;
      right: -110px;
      animation-delay: -5s;
    }

    .orb-3 {
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, #34d399 0%, #0ea5e9 65%, transparent 100%);
      bottom: -120px;
      left: 10%;
      animation-delay: -11s;
    }

    /* Плавающая каустика света за курсором / касанием */
    .caustic-glow {
      position: fixed;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.35) 0%, rgba(56, 189, 248, 0.12) 45%, transparent 70%);
      pointer-events: none;
      z-index: 1;
      transform: translate(-50%, -50%);
      transition: transform 0.15s ease-out;
      mix-blend-mode: overlay;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(35px, -30px) scale(1.08); }
      100% { transform: translate(-25px, 40px) scale(0.95); }
    }

    /* Стеклянный динамический остров-капля (Glass Dynamic Island) */
    .dynamic-island-wrapper {
      position: fixed;
      top: calc(env(safe-area-inset-top, 12px) + 10px);
      left: 0;
      right: 0;
      z-index: 1000;
      display: flex;
      justify-content: center;
      pointer-events: none;
      filter: url(#liquid-goo);
    }

    .glass-dynamic-island {
      pointer-events: auto;
      width: 280px;
      height: 48px;
      border-radius: 9999px;
      background: var(--glass-bg);
      backdrop-filter: blur(30px) saturate(200%);
      -webkit-backdrop-filter: blur(30px) saturate(200%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow), 0 12px 32px rgba(0, 122, 255, 0.22);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      cursor: pointer;
      opacity: 0;
      transform: translateY(-30px) scaleX(0.45) scaleY(0.45);
      transition: all 0.58s var(--spring-bounce);
      user-select: none;
    }

    .glass-dynamic-island.active {
      opacity: 1;
      transform: translateY(0) scaleX(1) scaleY(1);
      animation: liquidDropLanding 0.65s var(--spring-bounce);
    }

    .glass-dynamic-island:active {
      transform: scale(0.95);
    }

    @keyframes liquidDropLanding {
      0% { transform: translateY(-25px) scaleX(0.5) scaleY(1.3); }
      45% { transform: translateY(4px) scaleX(1.14) scaleY(0.86); }
      75% { transform: translateY(-2px) scaleX(0.96) scaleY(1.04); }
      100% { transform: translateY(0) scaleX(1) scaleY(1); }
    }

    .island-left {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .pulse-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      flex-shrink: 0;
      animation: pulseGlow 2s infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.65; }
    }

    .island-text {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
      overflow: hidden;
    }

    .island-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .island-subtitle {
      font-size: 10.5px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 175px;
    }

    .island-expand-icon {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Основной контейнер приложения */
    .app-shell {
      position: relative;
      z-index: 2;
      max-width: 560px;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top, 16px) + 14px) 14px calc(env(safe-area-inset-bottom, 24px) + 76px);
      transform-origin: top center;
      transition: transform 0.6s var(--spring-smooth), opacity 0.5s var(--spring-smooth), filter 0.55s var(--spring-smooth);
    }

    .app-shell.minimized {
      transform: translateY(-40px) scale(0.08);
      opacity: 0;
      filter: blur(22px);
      pointer-events: none;
      max-height: 100vh;
      overflow: hidden;
    }

    /* Базовый класс жидкого матового стекла */
    .liquid-glass {
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }

    /* Верхняя шапка */
    .top-header {
      border-radius: 28px;
      padding: 16px 18px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: all 0.45s var(--spring-smooth);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .grade-badge {
      width: 44px;
      height: 44px;
      border-radius: 15px;
      background: linear-gradient(135deg, #007aff 0%, #5856d6 100%);
      color: #fff;
      font-weight: 800;
      font-size: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px -4px rgba(0, 122, 255, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.6);
      flex-shrink: 0;
    }

    .header-titles h1 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .header-titles p {
      font-size: 12.5px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 9999px;
      border: 1px solid var(--glass-border);
      background: var(--glass-pill-bg);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.75), 0 6px 16px -4px rgba(0, 0, 0, 0.12);
      transition: all 0.4s var(--spring-bounce);
    }

    .icon-btn:hover {
      transform: translateY(-1px);
    }

    .icon-btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.65);
    }

    /* Парящий переключатель вариантов (Apple Segmented Liquid Pill) */
    .segmented-pill-container {
      position: sticky;
      top: calc(env(safe-area-inset-top, 8px) + 8px);
      z-index: 50;
      border-radius: 9999px;
      padding: 5px;
      margin-bottom: 12px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: var(--glass-pill-bg);
      backdrop-filter: blur(32px) saturate(200%);
      -webkit-backdrop-filter: blur(32px) saturate(200%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }

    .active-pill-indicator {
      position: absolute;
      top: 5px;
      bottom: 5px;
      left: 5px;
      width: calc((100% - 10px) / 3);
      border-radius: 9999px;
      background: var(--glass-active-pill);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.95), 0 6px 18px -4px rgba(0, 122, 255, 0.22);
      transition: transform 0.55s var(--spring-bounce);
      z-index: 0;
    }

    .active-pill-indicator.squish {
      transform: scaleX(1.09) scaleY(0.92);
    }

    .segment-btn {
      position: relative;
      z-index: 1;
      border: none;
      background: transparent;
      padding: 10px 8px;
      border-radius: 9999px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      transition: color 0.3s ease, transform 0.3s var(--spring-bounce);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }

    .segment-btn.active {
      color: var(--text-primary);
      font-weight: 700;
    }

    .segment-btn:active {
      transform: scale(0.95);
    }

    .variant-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-blue);
      opacity: 0.75;
    }

    /* Навигация по номерам задач внутри выбранного варианта */
    .task-chips-bar {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 2px 2px 12px;
      scrollbar-width: none;
    }

    .task-chips-bar::-webkit-scrollbar {
      display: none;
    }

    .task-chip {
      border: 1px solid var(--glass-border);
      background: var(--glass-pill-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: var(--text-secondary);
      padding: 7px 14px;
      border-radius: 9999px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.4s var(--spring-bounce);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.6);
    }

    .task-chip.active {
      background: linear-gradient(135deg, #007aff 0%, #5856d6 100%);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.5);
      box-shadow: 0 6px 16px -4px rgba(0, 122, 255, 0.45);
    }

    .task-chip:active {
      transform: scale(0.94);
    }

    /* Сводка варианта с доски */
    .board-summary-banner {
      border-radius: 22px;
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12.5px;
    }

    .board-summary-text {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .clean-mode-btn {
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.35);
      color: var(--text-primary);
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.35s var(--spring-bounce);
      white-space: nowrap;
    }

    .clean-mode-btn.active {
      background: var(--accent-emerald);
      color: #fff;
      border-color: transparent;
    }

    /* Поток карточек задач с бесшовной анимацией смены */
    .cards-stream {
      display: flex;
      flex-direction: column;
      gap: 20px;
      transition: opacity 0.38s var(--spring-smooth), transform 0.42s var(--spring-smooth), filter 0.38s var(--spring-smooth);
    }

    .cards-stream.switching {
      opacity: 0;
      filter: blur(10px);
      transform: translateY(12px) scale(0.98);
    }

    /* Карточка задачи (Squircle 28px) */
    .task-card {
      border-radius: 28px;
      overflow: hidden;
      transition: transform 0.5s var(--spring-smooth), box-shadow 0.5s var(--spring-smooth);
    }

    .task-card-header {
      padding: 16px 20px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--glass-border);
    }

    .task-number-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .task-order-pill {
      background: linear-gradient(135deg, #007aff, #5856d6);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 11px;
      border-radius: 9999px;
      box-shadow: 0 4px 10px rgba(0, 122, 255, 0.3);
    }

    .task-book-num {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .task-topic-tag {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--accent-blue);
      background: rgba(0, 122, 255, 0.1);
      padding: 3px 9px;
      border-radius: 9999px;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mini-glass-btn {
      border: 1px solid var(--glass-border);
      background: var(--glass-pill-bg);
      color: var(--text-primary);
      padding: 6px 11px;
      border-radius: 9999px;
      font-size: 11.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.35s var(--spring-bounce);
    }

    .mini-glass-btn:active {
      transform: scale(0.94);
    }

    /* Условие задачи (скрываемое в режиме «Чистый вид в тетрадь») */
    .problem-statement {
      padding: 12px 20px;
      font-size: 13.5px;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.18);
      border-bottom: 1px solid var(--glass-border);
      transition: all 0.35s ease;
    }

    body.clean-notebook-view .problem-statement {
      display: none;
    }

    /* ТЕТРАДНЫЙ ЛИСТ В КЛЕТКУ (Strict Grid System 24px = 1 клетка) */
    .russian-notebook-sheet {
      position: relative;
      background-color: var(--notebook-paper);
      background-image:
        linear-gradient(to right, var(--notebook-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--notebook-line) 1px, transparent 1px),
        linear-gradient(to right, var(--notebook-line-major) 1px, transparent 1px),
        linear-gradient(to bottom, var(--notebook-line-major) 1px, transparent 1px);
      background-size:
        24px 24px,
        24px 24px,
        120px 120px,
        120px 120px;
      background-position: 0 0;
      padding: 24px 36px 24px 24px;
    }

    /* Красная линия полей российской школьной тетради */
    .russian-notebook-sheet::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      right: 24px;
      width: 1.5px;
      background: var(--notebook-margin);
      pointer-events: none;
    }

    /* Контейнер чертежа SVG строго в узлах сетки 24px */
    .drawing-box {
      position: relative;
      width: 100%;
      margin-bottom: 18px;
      border-radius: 16px;
      border: 1px solid rgba(0, 145, 255, 0.28);
      background: rgba(255, 255, 255, 0.22);
      overflow: hidden;
      cursor: zoom-in;
      transition: transform 0.4s var(--spring-smooth), box-shadow 0.4s var(--spring-smooth);
    }

    .drawing-box:hover {
      box-shadow: 0 10px 25px -8px rgba(0, 122, 255, 0.22);
    }

    .drawing-toolbar {
      position: absolute;
      top: 8px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 3;
    }

    .grid-snap-badge {
      font-size: 10.5px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 9999px;
      background: var(--glass-pill-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      color: var(--text-secondary);
      pointer-events: auto;
    }

    .zoom-hint-pill {
      font-size: 10.5px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 9999px;
      background: var(--glass-pill-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      color: var(--accent-blue);
      display: flex;
      align-items: center;
      gap: 4px;
      pointer-events: auto;
    }

    .geometry-svg {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Стили линий и подписей внутри SVG на 5++ */
    .svg-main-line {
      stroke: var(--stroke-main);
      stroke-width: 2.2px;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .svg-hidden-line {
      stroke: var(--stroke-main);
      stroke-width: 1.8px;
      stroke-dasharray: 6, 4;
      stroke-linecap: round;
      fill: none;
      opacity: 0.78;
    }

    .svg-aux-line {
      stroke: var(--stroke-aux);
      stroke-width: 1.8px;
      stroke-dasharray: 6, 4;
      stroke-linecap: round;
      fill: none;
    }

      stroke-linecap: round;
      fill: none;

      fill: rgba(0, 122, 255, 0.12);

      stroke: var(--stroke-main);
      stroke-width: 1.8px;
      stroke-linejoin: round;

    .svg-plane-2 {
      fill: var(--plane-fill-2);
      stroke: var(--stroke-main);
      stroke-width: 1.8px;
      stroke-linejoin: round;
    }

    .svg-vertex {

      stroke: #ffffff;
      stroke-width: 1.4px;
    }

    .svg-label {

      font-weight: 700;
      font-size: 16px;
      fill: var(--stroke-main);

      font-weight: 700;
      fill: var(--stroke-accent);
      user-select: none;

      font-size: 14px;
      line-height: 1.55;

      font-weight: 800;

      align-items: center;
      justify-content: space-between;
      gap: 10px;

      font-size: 12.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--accent-emerald);
    }

      font-size: 15px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .floating-bottom-dock {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 12px) + 12px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 90;
      border-radius: 9999px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 8px;

      transform: translateX(-50%) translateY(100px) scale(0.8);
      opacity: 0;
      pointer-events: none;
    }

    .dock-pill-btn {
      border: none;
      background: transparent;
      color: var(--text-primary);

      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;

      align-items: center;

      background: rgba(255, 255, 255, 0.28);

      transform: scale(0.93);
    }

    .dock-divider {
      width: 1px;
      height: 20px;
      background: var(--glass-border);

      inset: 0;
      z-index: 2000;

    .modal-header {

      align-items: center;

    }

    .modal-title {

      font-weight: 700;
    }

    .glass-toast {

      opacity: 1;
    }

    .katex {

</head>

        statement: "В треугольнике \\(ABC\\) дано: \\(\\angle C = 90^\\circ\\), \\(AC = 6\\text{ см}\\), \\(BC = 8\\text{ см}\\), \\(CM\\) — медиана. Через вершину \\(C\\) проведена прямая \\(CK\\), перпендикулярная к плоскости треугольника \\(ABC\\), причем \\(CK = 12\\text{ см}\\). Найдите \\(KM\\).",
        dano: "\\(\\triangle ABC\\) (\\(\\angle C = 90^\\circ\\)), \\(AC = 6\\text{ см}\\), \\(BC = 8\\text{ см}\\), \\(AM = MB\\), \\(CK \\perp (ABC)\\), \\(CK = 12\\text{ см}\\).",
        goalTitle: "Найти",
        goal: "\\(KM\\).",
        svgKey: "task121",
        solutionTitle: "Решение",
        steps: [
          "В прямоугольном \\(\\triangle ABC\\) (\\(\\angle C = 90^\\circ\\)) найдем гипотенузу \\(AB\\) <span class='justification'>(по теореме Пифагора)</span>:<br>\\[AB = \\sqrt{AC^2 + BC^2} = \\sqrt{6^2 + 8^2} = \\sqrt{36 + 64} = \\sqrt{100} = 10\\text{ (см)}.\\]",
          "Медиана прямоугольного треугольника, проведенная к гипотенузе, равна половине гипотенузы <span class='justification'>(по свойству медианы прямоугольного треугольника)</span>:<br>\\[CM = \\frac{1}{2}AB = \\frac{10}{2} = 5\\text{ (см)}.\\]",
          "Так как \\(CK \\perp (ABC)\\) и \\(CM \\subset (ABC)\\), то \\(CK \\perp CM\\) (\\(\\angle KCM = 90^\\circ\\)) <span class='justification'>(по определению прямой, перпендикулярной к плоскости)</span>.",
          "Из прямоугольного \\(\\triangle KCM\\) <span class='justification'>(по теореме Пифагора)</span>:<br>\\[KM = \\sqrt{CK^2 + CM^2} = \\sqrt{12^2 + 5^2} = \\sqrt{144 + 25} = \\sqrt{169} = 13\\text{ (см)}.\\]<span class='justification'>(Для карандашной пометки \\(CK = 6\\text{ см}\\): \\(KM = \\sqrt{6^2 + 5^2} = \\sqrt{61}\\text{ см}\\)).</span>"
        ],
        answer: "\\(13\\text{ см}\\)",
        plainCopy: "№ 121.\nДано: △ABC (∠C = 90°), AC = 6 см, BC = 8 см, CM — медиана, CK ⊥ (ABC), CK = 12 см.\nНайти: KM.\nРешение:\n1) Из прямоугольного △ABC по т. Пифагора: AB = √(AC² + BC²) = √(36 + 64) = 10 (см).\n2) По свойству медианы прямоугольного треугольника, проведенной к гипотенузе: CM = AB / 2 = 5 (см).\n3) Т.к. CK ⊥ (ABC) и CM ⊂ (ABC), то CK ⊥ CM (∠KCM = 90°).\n4) Из прямоугольного △KCM по т. Пифагора: KM = √(CK² + CM²) = √(144 + 25) = √169 = 13 (см).\nОтвет: 13 см."
      }
    };

    /* Конфигурация вариантов строго по записи на классной доске */
    const VARIANTS_CONFIG = {
      v1: {
        name: "Вариант 1 (В-1)",
        shortIsland: "В-1 • Решено на 5++",
        quickAnswers: "1) α∥β • 2) единств. • 3) AB=DB • 4) 9 см • 5) MO⊥BD",
        boardLabel: "В-1 с доски: 1. №123 • 2. №133 • 3. №119(а) • 4. №125 • 5. №129(б)",
        tasks: [
          { order: 1, key: "123" },
          { order: 2, key: "133" },
          { order: 3, key: "119a" },
          { order: 4, key: "125" },
          { order: 5, key: "129b" }
        ]
      },
      v2: {
        name: "Вариант 2 (В-2)",
        shortIsland: "В-2 • Решено на 5++",
        quickAnswers: "1) α∥β • 2) единств. • 3) AB=AC • 4) 9 см • 5) BD⊥(AMO)",
        boardLabel: "В-2 с доски: 1. №123 • 2. №133 • 3. №119(б) • 4. №125 • 5. №129(а)",
        tasks: [
          { order: 1, key: "123" },
          { order: 2, key: "133" },
          { order: 3, key: "119b" },
          { order: 4, key: "125" },
          { order: 5, key: "129a" }
        ]
      },
      extra: {
        name: "Доп. с фото (№120, №121)",
        shortIsland: "Доп. • №120, №121 (5++)",
        quickAnswers: "№120: √(b²+a²/2) • №121: KM = 13 см",
        boardLabel: "Отмеченные карандашом в учебнике: №120 и №121",
        tasks: [
          { order: 1, key: "120" },
          { order: 2, key: "121" }
        ]
      }
    };

    /* Состояние приложения */
    let currentVariant = "v1";
    let currentTaskFilter = "all";

    /* Элементы DOM */
    const cardsStream = document.getElementById("cardsStream");
    const taskChipsBar = document.getElementById("taskChipsBar");
    const boardSummaryText = document.getElementById("boardSummaryText");
    const activePillIndicator = document.getElementById("activePillIndicator");
    const segmentButtons = document.querySelectorAll(".segment-btn");
    const appShell = document.getElementById("appShell");
    const glassDynamicIsland = document.getElementById("glassDynamicIsland");
    const islandVariantLabel = document.getElementById("islandVariantLabel");
    const islandQuickAnswer = document.getElementById("islandQuickAnswer");
    const floatingDock = document.getElementById("floatingDock");
    const glassToast = document.getElementById("glassToast");
    const glassToastText = document.getElementById("glassToastText");
    const zoomModalBackdrop = document.getElementById("zoomModalBackdrop");
    const zoomModalBody = document.getElementById("zoomModalBody");
    const zoomModalTitle = document.getElementById("zoomModalTitle");

    /* Рендеринг математических формул KaTeX */
    function triggerMathRender(container) {
      if (window.renderMathInElement) {
        window.renderMathInElement(container, {
          delimiters: [
            { left: "\\[", right: "\\]", display: true },
            { left: "\\(", right: "\\)", display: false }
          ],
          throwOnError: false
        });
      }
    }

    /* Отрисовка чипсов быстрого перехода по задачам */
    function renderTaskChips() {
      const config = VARIANTS_CONFIG[currentVariant];
      let html = `<button class="task-chip ${currentTaskFilter === "all" ? "active" : ""}" data-filter="all">Все (${config.tasks.length})</button>`;
      config.tasks.forEach(item => {
        const prob = PROBLEMS_DB[item.key];
        const isActive = currentTaskFilter === item.key ? "active" : "";
        html += `<button class="task-chip ${isActive}" data-filter="${item.key}">${item.order}. ${prob.bookNum}</button>`;
      });
      taskChipsBar.innerHTML = html;

      taskChipsBar.querySelectorAll(".task-chip").forEach(chip => {
        chip.addEventListener("click", () => {
          currentTaskFilter = chip.getAttribute("data-filter");
          renderTaskChips();
          animateAndRenderCards();
        });
      });
    }

    /* Генерация карточек выбранного варианта */
    function renderCards() {
      const config = VARIANTS_CONFIG[currentVariant];
      boardSummaryText.querySelector("span").textContent = config.boardLabel;
      islandVariantLabel.textContent = config.shortIsland;
      islandQuickAnswer.textContent = config.quickAnswers;

      const filteredTasks = currentTaskFilter === "all"
        ? config.tasks
        : config.tasks.filter(t => t.key === currentTaskFilter);

      cardsStream.innerHTML = filteredTasks.map(item => {
        const prob = PROBLEMS_DB[item.key];
        const svgMarkup = SVG_DRAWINGS[prob.svgKey] ? SVG_DRAWINGS[prob.svgKey]() : "";
        const stepsHtml = prob.steps.map((step, idx) => `
          <li class="step-item">
            <span class="step-num">${idx + 1}</span>
            <div class="step-text">${step}</div>
          </li>
        `).join("");

        return `
          <article class="task-card liquid-glass" data-problem-key="${prob.id}">
            <div class="task-card-header">
              <div class="task-number-group">
                <span class="task-order-pill">Задание ${item.order}</span>
                <span class="task-book-num">${prob.bookNum}</span>
                <span class="task-topic-tag">${prob.topic}</span>
              </div>
              <div class="card-actions">
                <button class="mini-glass-btn copy-task-btn" data-key="${prob.id}" title="Скопировать решение">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                  </svg>
                  <span>Копировать</span>
                </button>
              </div>
            </div>

            <div class="problem-statement">${prob.statement}</div>

            <!-- Тетрадный лист в клетку (24px = 1 клетка) -->
            <div class="russian-notebook-sheet">
              <!-- Чертеж строго по узлам клеток -->
              <div class="drawing-box" data-svg-key="${prob.svgKey}" data-title="${prob.bookNum} • Чертеж по клеткам">
                <div class="drawing-toolbar">
                  <span class="grid-snap-badge">Сетка: 24px = 1 кл.</span>
                  <span class="zoom-hint-pill">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                      <circle cx="11" cy="11" r="8"></circle>
                      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                      <line x1="11" y1="8" x2="11" y2="14"></line>
                      <line x1="8" y1="11" x2="14" y2="11"></line>
                    </svg>
                    На весь экран
                  </span>
                </div>
                ${svgMarkup}
              </div>

              <!-- Дано и Найти / Доказать -->
              <div class="academic-grid">
                <div class="academic-box">
                  <div class="academic-title">Дано:</div>
                  <div class="academic-content">${prob.dano}</div>
                </div>
                <div class="academic-box">
                  <div class="academic-title">${prob.goalTitle}:</div>
                  <div class="academic-content">${prob.goal}</div>
                </div>
              </div>

              <!-- Пошаговое решение / доказательство -->
              <div class="solution-section-title">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="9 11 12 14 22 4"></polyline>
                  <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                </svg>
                <span>${prob.solutionTitle}:</span>
              </div>

              <ol class="steps-list">
                ${stepsHtml}
              </ol>

              <!-- Ответ / Ч.т.д. -->
              <div class="answer-banner">
                <span class="answer-label">Ответ:</span>
                <span class="answer-value">${prob.answer}</span>
              </div>
            </div>
          </article>
        `;
      }).join("");

      triggerMathRender(cardsStream);
      attachCardEvents();
    }

    /* Анимированная смена карточек при переключении вариантов */
    function animateAndRenderCards() {
      cardsStream.classList.add("switching");
      setTimeout(() => {
        renderCards();
        cardsStream.classList.remove("switching");
      }, 210);
    }

    /* Обработчики кнопок внутри карточек (копирование и зум чертежа) */
    function attachCardEvents() {
      document.querySelectorAll(".copy-task-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const key = btn.getAttribute("data-key");
          const prob = PROBLEMS_DB[key];
          if (prob) {
            copyTextToClipboard(prob.plainCopy, `Скопировано: ${prob.bookNum}`);
          }
        });
      });

      document.querySelectorAll(".drawing-box").forEach(box => {
        box.addEventListener("click", () => {
          const svgKey = box.getAttribute("data-svg-key");
          const title = box.getAttribute("data-title");
          if (SVG_DRAWINGS[svgKey]) {
            zoomModalTitle.textContent = title;
            zoomModalBody.innerHTML = SVG_DRAWINGS[svgKey]();
            zoomModalBackdrop.classList.add("open");
          }
        });
      });
    }

    /* Переключение вариантов в парящей капсуле (Squish & Stretch физика) */
    segmentButtons.forEach((btn, index) => {
      btn.addEventListener("click", () => {
        const selectedVariant = btn.getAttribute("data-variant");
        if (selectedVariant === currentVariant) return;

        currentVariant = selectedVariant;
        currentTaskFilter = "all";

        segmentButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");

        activePillIndicator.style.transform = `translateX(${index * 100}%) scaleX(1.08) scaleY(0.92)`;
        setTimeout(() => {
          activePillIndicator.style.transform = `translateX(${index * 100}%) scaleX(1) scaleY(1)`;
        }, 260);

        renderTaskChips();
        animateAndRenderCards();
      });
    });

    /* Сворачивание в «Стеклянный Остров-Каплю» (Glass Dynamic Island) */
    function minimizeToGlassIsland() {
      appShell.classList.add("minimized");
      floatingDock.classList.add("hidden");
      glassDynamicIsland.classList.add("active");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function expandFromGlassIsland() {
      glassDynamicIsland.classList.remove("active");
      appShell.classList.remove("minimized");
      floatingDock.classList.remove("hidden");
    }

    document.getElementById("minimizeToIslandBtn").addEventListener("click", minimizeToGlassIsland);
    document.getElementById("dockMinimizeBtn").addEventListener("click", minimizeToGlassIsland);
    glassDynamicIsland.addEventListener("click", expandFromGlassIsland);

    /* Переключение режима «Чистый вид в тетрадь» */
    const cleanModeBtn = document.getElementById("cleanModeBtn");
    cleanModeBtn.addEventListener("click", () => {
      document.body.classList.toggle("clean-notebook-view");
      const isClean = document.body.classList.contains("clean-notebook-view");
      cleanModeBtn.classList.toggle("active", isClean);
      cleanModeBtn.textContent = isClean ? "Полный вид" : "Чистый вид";
    });

    /* Переключение отображения координат узлов клеток (k, m) */
    const toggleCoordsBtn = document.getElementById("toggleCoordsBtn");
    toggleCoordsBtn.addEventListener("click", () => {
      document.body.classList.toggle("show-grid-coords");
      const active = document.body.classList.contains("show-grid-coords");
      showGlassToast(active ? "Узлы клеток (k; m) включены" : "Узлы клеток скрыты");
    });

    document.getElementById("modalToggleCoordsBtn").addEventListener("click", () => {
      zoomModalBody.classList.toggle("show-grid-coords");
    });

    /* Закрытие модального окна чертежа */
    document.getElementById("closeZoomModalBtn").addEventListener("click", () => {
      zoomModalBackdrop.classList.remove("open");
    });
    zoomModalBackdrop.addEventListener("click", (e) => {
      if (e.target === zoomModalBackdrop) {
        zoomModalBackdrop.classList.remove("open");
      }
    });

    /* Переключение Светлой / Темной темы */
    const themeToggleBtn = document.getElementById("themeToggleBtn");
    themeToggleBtn.addEventListener("click", () => {
      const htmlEl = document.documentElement;
      const nextTheme = htmlEl.getAttribute("data-theme") === "dark" ? "light" : "dark";
      htmlEl.setAttribute("data-theme", nextTheme);
    });

    /* Надежное копирование в буфер обмена через document.execCommand('copy') */
    function copyTextToClipboard(text, message) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand("copy");
        showGlassToast(message || "Скопировано в буфер обмена");
      } catch (err) {
        showGlassToast("Не удалось скопировать");
      }
      document.body.removeChild(textarea);
    }

    /* Копирование всего текущего варианта целиком */
    document.getElementById("dockCopyAllBtn").addEventListener("click", () => {
      const config = VARIANTS_CONFIG[currentVariant];
      const fullText = config.tasks
        .map(t => PROBLEMS_DB[t.key].plainCopy)
        .join("\n\n----------------------------------\n\n");
      copyTextToClipboard(fullText, `${config.name} полностью скопирован!`);
    });

    let toastTimer = null;
    function showGlassToast(msg) {
      glassToastText.textContent = msg;
      glassToast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        glassToast.classList.remove("show");
      }, 2400);
    }

    /* Плавающая каустика света за движением пальца / курсора */
    const causticGlow = document.getElementById("causticGlow");
    window.addEventListener("pointermove", (e) => {
      causticGlow.style.transform = `translate(${e.clientX - 160}px, ${e.clientY - 160}px)`;
    }, { passive: true });

    /* Инициализация после загрузки страницы и KaTeX */
    window.addEventListener("DOMContentLoaded", () => {
      renderTaskChips();
      renderCards();
    });
    window.addEventListener("load", () => {
      triggerMathRender(document.body);
    });
  </script>
</body>
</html>
