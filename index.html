      if (fromHash.currentPage) state.currentPage = fromHash.currentPage;
      if (typeof fromHash.scrollY === "number") state.scrollPositions[state.currentPage] = fromHash.scrollY;
      if (fromHash.theme) state.theme = fromHash.theme;
      if (fromHash.ruling) state.ruling = fromHash.ruling;
      if (fromHash.fontSize) state.fontSize = fromHash.fontSize;
      if (typeof fromHash.hudCollapsed === "boolean") state.hudCollapsed = fromHash.hudCollapsed;
      if (typeof fromHash.swipeEnabled === "boolean") state.swipeEnabled = fromHash.swipeEnabled;
      if (fromHash.turnAnim) state.turnAnim = fromHash.turnAnim;
      if (typeof fromHash.focusRuler === "boolean") state.focusRuler = fromHash.focusRuler;
    }
  }

  async function hydrateFromIDB() {
    await LocalDB.open();
    const snap = await LocalDB.get("snapshot_v2") || await LocalDB.get("userData");
    if (!snap || typeof snap !== "object") return false;
    const tsIDB = Number(snap.updatedAt) || 0;
    // Only overwrite active state if IDB is strictly newer or we had no sync snapshot at all
    if (lastSavedTs === 0 || tsIDB > lastSavedTs) {
      applySnapshotToState(snap);
      return true;
    }
    return false;
  }

  // Save immediately when page is hidden / closed / reloaded
  window.addEventListener("pagehide", saveSyncNow);
  window.addEventListener("beforeunload", saveSyncNow);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") saveSyncNow(); });

  function applyVisualPrefs() {
    const root = document.documentElement;
    root.setAttribute("data-theme", state.theme);
    root.setAttribute("data-ruling", state.ruling);
    root.setAttribute("data-compact", String(state.compact));
    root.setAttribute("data-hud", state.hudCollapsed ? "collapsed" : "open");
    root.setAttribute("data-tap-zones", String(state.tapZones));
    root.setAttribute("data-focus-ruler", String(state.focusRuler));
    root.setAttribute("data-reduced-fx", String(state.reducedFx));
    root.style.setProperty("--read-size", state.fontSize + "px");
    root.style.setProperty("--read-lh", String(state.lineHeight));
    root.style.setProperty("--dim-opacity", String(state.dimness));
  }

  // =========================================================================
  // Page HTML Renderer (Strict 1-to-1)
  // =========================================================================
  function decorateText(rawText, pageNum) {
    let text = String(rawText || "");
    const fixes = state.wordFixes[pageNum] || {};
    let html = escapeHtml(text).replace(/\{\{\?([^}]+)\}\}/g, (_, w) => {
      const fixed = fixes[w];
      if (fixed) {
        return `<span class="uncertain-word" style="border-bottom-color:var(--accent);background:var(--accent-soft)" data-uncertain="${escapeHtml(w)}" data-page="${pageNum}" title="Исправлено локально">${escapeHtml(fixed)}</span>`;
      }
      return `<span class="uncertain-word" data-uncertain="${escapeHtml(w)}" data-page="${pageNum}" title="Уточнить слово">${escapeHtml(w)}</span>`;
    });

    const hls = state.highlights[pageNum] || [];
    for (const hl of hls) {
      if (!hl.text || hl.text.length < 2) continue;
      const esc = escapeHtml(hl.text).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      try { html = html.replace(new RegExp(esc, "g"), `<mark class="user-hl" data-color="${escapeHtml(hl.color)}" data-hl-text="${escapeHtml(hl.text)}">$&</mark>`); } catch (_) {}
    }

    if (state.activeSearchTerm && state.activeSearchTerm.length >= 2) {
      const pattern = escapeHtml(state.activeSearchTerm).replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/[еёЕЁ]/g, "[еёЕЁ]");
      try { html = html.replace(new RegExp(`(${pattern})(?![^<]*>)`, "gi"), '<mark class="search-hit">$1</mark>'); } catch (_) {}
    }
    return html;
  }

  function renderTableHtml(block, pageNum, blockIdx) {
    const caption = block.caption ? escapeHtml(block.caption) : "Таблица";
    let contBadge = "";
    if (block.continued_from_prev) contBadge = '<span class="nb-table-continuation">Продолжение с пред. стр.</span>';
    else if (block.continues_to_next) contBadge = '<span class="nb-table-continuation">Продолжение на след. стр.</span>';

    const headers = (block.headers || []).map((h) => {
      if (typeof h === "object" && h !== null) {
        return `<th${h.colspan ? ` colspan="${h.colspan}"` : ""}${h.rowspan ? ` rowspan="${h.rowspan}"` : ""}>${decorateText(h.text || "", pageNum)}</th>`;
      }
      return `<th>${decorateText(h, pageNum)}</th>`;
    }).join("");

    const rows = (block.rows || []).map((row) => {
      const cells = (row || []).map((c) => {
        if (typeof c === "object" && c !== null) {
          return `<td${c.colspan ? ` colspan="${c.colspan}"` : ""}${c.rowspan ? ` rowspan="${c.rowspan}"` : ""}>${decorateText(c.text || "", pageNum)}</td>`;
        }
        return `<td>${decorateText(c, pageNum)}</td>`;
      }).join("");
      return `<tr>${cells}</tr>`;
    }).join("");

    return `
      <div class="nb-table-card" data-block-idx="${blockIdx}">
        <div class="nb-table-headbar">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span>${caption}</span>${contBadge}</div>
          <button class="mini-action-btn" data-copy-table="${blockIdx}">Копировать</button>
        </div>
        <div class="table-scroll-wrap">
          <table class="nb-table">${headers ? `<thead><tr>${headers}</tr></thead>` : ""}<tbody>${rows}</tbody></table>
        </div>
      </div>`;
  }

  function renderPageContent(pageNum) {
    const pg = PAGES[pageNum - 1];
    if (!pg) return "";
    const pageEdits = state.edits[pageNum] || {};
    const hasEdits = Object.keys(pageEdits).length > 0;
    const hasNote = !!(state.notes[pageNum] && state.notes[pageNum].text.trim());
    const bm = state.bookmarks[pageNum];
    const bmTag = bm ? getTagById(bm.tagId) : null;

    const blocksHtml = (pg.blocks || []).map((b, idx) => {
      const overrideText = pageEdits[idx];
      const editableAttr = state.editMode ? `contenteditable="true" data-editable-block="${idx}"` : "";
      const t = b.type;
      if (t === "heading") {
        const lvl = Math.min(3, Math.max(1, Number(b.level) || 1));
        return `<h${lvl} class="nb-h${lvl}" data-block-idx="${idx}" ${editableAttr}>${decorateText(overrideText !== undefined ? overrideText : b.text, pageNum)}</h${lvl}>`;
      }
      if (t === "paragraph") return `<p class="nb-p" data-block-idx="${idx}" ${editableAttr}>${decorateText(overrideText !== undefined ? overrideText : b.text, pageNum)}</p>`;
      if (t === "definition") return `<div class="nb-definition" data-block-idx="${idx}"><strong>${decorateText(b.term || "", pageNum)}</strong> — <span ${editableAttr}>${decorateText(overrideText !== undefined ? overrideText : b.text, pageNum)}</span></div>`;
      if (t === "callout") return `<div class="nb-callout" data-block-idx="${idx}">${b.label ? `<div class="nb-callout-label">${escapeHtml(b.label)}</div>` : ""}<div ${editableAttr}>${decorateText(overrideText !== undefined ? overrideText : b.text, pageNum)}</div></div>`;
      if (t === "marginalia") return `<div class="nb-marginalia" data-block-idx="${idx}" ${editableAttr}>${decorateText(overrideText !== undefined ? overrideText : b.text, pageNum)}</div>`;
      if (t === "list") {
        const tag = b.ordered ? "ol" : "ul";
        return `<${tag} class="nb-list" data-block-idx="${idx}">${(b.items || []).map((it) => `<li>${decorateText(it, pageNum)}</li>`).join("")}</${tag}>`;
      }
      if (t === "table") return renderTableHtml(b, pageNum, idx);
      if (t === "formula") return `<div class="nb-formula-box" data-block-idx="${idx}">${b.label ? `<div class="nb-formula-label">${escapeHtml(b.label)}</div>` : ""}${renderLatexToHtml(b.latex)}</div>`;
      if (t === "diagram") return `<div class="nb-diagram" data-block-idx="${idx}">${b.svg || ""}${b.title ? `<div class="nb-diagram-title">${escapeHtml(b.title)}</div>` : ""}</div>`;
      return "";
    }).join("");

    return `
      <button class="page-bookmark-ribbon ${bm ? "active" : ""}" data-ribbon-page="${pageNum}" style="background:${bmTag ? bmTag.color : "var(--accent)"}" title="Настроить закладку">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        <span>${bmTag ? escapeHtml(bmTag.name) : "Закладка"}</span>
      </button>
      <div class="page-scroll" data-scroll-page="${pageNum}">
        <div class="page-inner ${state.editMode ? "is-editing" : ""}">
          <div class="page-meta-bar">
            <div class="page-meta-left">
              <span class="page-num-chip">Стр. ${pageNum} из ${TOTAL}</span>
              ${pg.date ? `<span class="page-date-badge">${escapeHtml(pg.date)}</span>` : ""}
            </div>
            <div class="page-meta-actions">
              ${hasNote ? `<button class="mini-action-btn has-note" data-open-note="${pageNum}">Заметка</button>` : ""}
              <button class="mini-action-btn" data-copy-page="${pageNum}">Копировать</button>
            </div>
          </div>
          <div class="edit-banner ${state.editMode ? "visible" : ""}">
            <span>Режим локальной правки активен</span>
            <div style="display:flex;gap:6px">
              ${hasEdits ? `<button class="mini-action-btn" data-reset-edits="${pageNum}">Вернуть исходный</button>` : ""}
              <button class="mini-action-btn" data-finish-edit="1">Готово</button>
            </div>
          </div>
          ${blocksHtml}
        </div>
      </div>
      <div class="page-lighting"></div>
      <div class="page-cast-shadow"></div>`;
  }

  // =========================================================================
  // Virtualized 3-Page Stack & Instant Scroll Teleport
  // =========================================================================
  const stageEl = document.getElementById("stage");
  const layerPrev = document.getElementById("layer-prev");
  const layerCurr = document.getElementById("layer-curr");
  const layerNext = document.getElementById("layer-next");

  function renderStack() {
    const p = state.currentPage;
    layerPrev.innerHTML = p > 1 ? renderPageContent(p - 1) : "";
    layerCurr.innerHTML = renderPageContent(p);
    layerNext.innerHTML = p < TOTAL ? renderPageContent(p + 1) : "";
    resetLayerTransforms();

    const scrollEl = layerCurr.querySelector(".page-scroll");
    if (scrollEl) {
      const savedY = Number(state.scrollPositions[p]) || 0;
      scrollEl.scrollTop = savedY;
      // Double-frame restore ensures exact teleport after layout settle
      requestAnimationFrame(() => { scrollEl.scrollTop = savedY; });
      attachScrollWatcher(scrollEl, p);
    }

    updateHud();
    if (state.activeSearchTerm) updateSearchMatchesOnCurrentPage(false);
  }

  function resetLayerTransforms() {
    [layerPrev, layerCurr, layerNext].forEach((el) => {
      el.style.transition = "none"; el.style.opacity = "1";
      const l = el.querySelector(".page-lighting"), s = el.querySelector(".page-cast-shadow");
      if (l) l.style.opacity = "0"; if (s) s.style.opacity = "0";
    });
    layerPrev.style.transform = "translate3d(-100%, 0, 0)"; layerPrev.style.zIndex = "3";
    layerCurr.style.transform = "translate3d(0, 0, 0) rotateY(0deg)"; layerCurr.style.zIndex = "2";
    layerNext.style.transform = "translate3d(0, 0, 0)"; layerNext.style.zIndex = "1";
  }

  let lastScrollY = 0, scrollSaveTimer = null;
  function attachScrollWatcher(scrollEl, pageNum) {
    lastScrollY = scrollEl.scrollTop;
    scrollEl.addEventListener("scroll", () => {
      const y = scrollEl.scrollTop;
      state.scrollPositions[pageNum] = Math.round(y);
      if (state.autoHideHud && !state.editMode) {
        if (y - lastScrollY > 24 && y > 60 && !state.hudCollapsed) setHudCollapsed(true);
        else if (lastScrollY - y > 28 && state.hudCollapsed) setHudCollapsed(false);
      }
      lastScrollY = y;
      clearTimeout(scrollSaveTimer);
      scrollSaveTimer = setTimeout(persistAll, 45);
    }, { passive: true });
  }

  // =========================================================================
  // Page Navigation & Smooth Animations
  // =========================================================================
  function goToPage(targetPage, opts = {}) {
    const p = Math.max(1, Math.min(TOTAL, Number(targetPage) || 1));
    if (p === state.currentPage && !opts.force) return;
    state.currentPage = p;
    state.isTurning = false;
    vibrate(8);
    renderStack();
    persistAll();
    if (opts.scrollToMatch) setTimeout(() => updateSearchMatchesOnCurrentPage(true), 40);
  }

  function animateTurn(dir) {
    if (state.isTurning) return;
    const target = state.currentPage + dir;
    if (target < 1 || target > TOTAL) {
      layerCurr.style.transition = "transform 280ms var(--spring-snappy)";
      layerCurr.style.transform = `translate3d(${dir > 0 ? -24 : 24}px, 0, 0)`;
      setTimeout(() => { layerCurr.style.transform = "translate3d(0, 0, 0)"; }, 150);
      vibrate(14);
      return;
    }
    if (state.turnAnim === "none" || state.reducedFx) { goToPage(target); return; }
    state.isTurning = true;
    const ease = "cubic-bezier(0.22, 1, 0.36, 1)";
    if (state.turnAnim === "slide") {
      const dur = 270;
      if (dir > 0) {
        layerCurr.style.zIndex = "3"; layerNext.style.zIndex = "2";
        layerCurr.style.transition = `transform ${dur}ms ${ease}, opacity ${dur}ms ease`;
        layerCurr.style.transform = "translate3d(-100%, 0, 0)"; layerCurr.style.opacity = "0.5";
      } else {
        layerPrev.style.zIndex = "4"; layerPrev.style.transition = "none";
        layerPrev.style.transform = "translate3d(-100%, 0, 0)"; void layerPrev.offsetWidth;
        layerPrev.style.transition = `transform ${dur}ms ${ease}`; layerPrev.style.transform = "translate3d(0, 0, 0)";
      }
      setTimeout(() => goToPage(target), dur - 10);
      return;
    }
    const dur = 350;
    if (dir > 0) {
      layerCurr.style.zIndex = "3"; layerNext.style.zIndex = "2";
      layerCurr.style.transition = `transform ${dur}ms ${ease}, opacity ${dur}ms ease`;
      layerCurr.style.transform = "translate3d(-18%, 0, 0) rotateY(-68deg)"; layerCurr.style.opacity = "0.14";
      const l = layerCurr.querySelector(".page-lighting");
      if (l) { l.style.transition = `opacity ${dur}ms ease`; l.style.opacity = "0.85"; }
    } else {
      layerPrev.style.zIndex = "4"; layerPrev.style.transition = "none";
      layerPrev.style.transform = "translate3d(-22%, 0, 0) rotateY(-58deg)"; layerPrev.style.opacity = "0.32";
      void layerPrev.offsetWidth;
      layerPrev.style.transition = `transform ${dur}ms ${ease}, opacity ${dur}ms ease`;
      layerPrev.style.transform = "translate3d(0, 0, 0) rotateY(0deg)"; layerPrev.style.opacity = "1";
    }
    setTimeout(() => goToPage(target), dur - 10);
  }

  // =========================================================================
  // 1:1 Gesture-Driven Swipe Engine
  // =========================================================================
  let drag = { active: false, lockedAxis: null, startX: 0, startY: 0, startTime: 0, dx: 0, dir: 0 };

  function isInsideScrollableTable(target) {
    const wrap = target && target.closest ? target.closest(".table-scroll-wrap") : null;
    return !!(wrap && wrap.scrollWidth > wrap.clientWidth + 4);
  }

  stageEl.addEventListener("touchstart", (e) => {
    if (!state.swipeEnabled || e.touches.length !== 1 || state.activeSheet || state.editMode || state.isTurning) return;
    if (isInsideScrollableTable(e.target)) return;
    const t = e.touches[0];
    drag = { active: true, lockedAxis: null, startX: t.clientX, startY: t.clientY, startTime: performance.now(), dx: 0, dir: 0 };
  }, { passive: true });

  stageEl.addEventListener("touchmove", (e) => {
    if (!drag.active || e.touches.length !== 1) return;
    const t = e.touches[0];
    const dx = t.clientX - drag.startX, dy = t.clientY - drag.startY;
    if (!drag.lockedAxis) {
      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
      if (Math.abs(dx) > Math.abs(dy) * 1.25) drag.lockedAxis = "x";
      else { drag.lockedAxis = "y"; drag.active = false; return; }
    }
    if (drag.lockedAxis === "x") {
      e.preventDefault();
      drag.dx = dx;
      const w = stageEl.clientWidth || 390;
      const progress = Math.min(1, Math.abs(dx) / w);

      if (dx < 0) {
        if (state.currentPage >= TOTAL) { layerCurr.style.transform = `translate3d(${-Math.pow(Math.abs(dx), 0.72)}px, 0, 0)`; return; }
        drag.dir = 1; layerCurr.style.zIndex = "3"; layerNext.style.zIndex = "2";
        if (state.turnAnim === "slide") layerCurr.style.transform = `translate3d(${dx}px, 0, 0)`;
        else {
          layerCurr.style.transform = `translate3d(${-progress * 20}%, 0, 0) rotateY(${-progress * 74}deg)`;
          const l = layerCurr.querySelector(".page-lighting"), s = layerNext.querySelector(".page-cast-shadow");
          if (l) l.style.opacity = String(Math.min(0.9, progress * 1.15));
          if (s) s.style.opacity = String(Math.max(0, (1 - progress) * 0.65));
        }
      } else {
        if (state.currentPage <= 1) { layerCurr.style.transform = `translate3d(${Math.pow(Math.abs(dx), 0.72)}px, 0, 0)`; return; }
        drag.dir = -1; layerPrev.style.zIndex = "4";
        const inv = 1 - progress;
        if (state.turnAnim === "slide") layerPrev.style.transform = `translate3d(${-w + dx}px, 0, 0)`;
        else {
          layerPrev.style.transform = `translate3d(${-inv * 24}%, 0, 0) rotateY(${-inv * 68}deg)`;
          const l = layerPrev.querySelector(".page-lighting"), s = layerCurr.querySelector(".page-cast-shadow");
          if (l) l.style.opacity = String(inv * 0.85);
          if (s) s.style.opacity = String(progress * 0.55);
        }
      }
    }
  }, { passive: false });

  stageEl.addEventListener("touchend", () => {
    if (!drag.active || drag.lockedAxis !== "x") { drag.active = false; return; }
    drag.active = false;
    const w = stageEl.clientWidth || 390;
    const dt = Math.max(16, performance.now() - drag.startTime);
    const shouldTurn = ((Math.abs(drag.dx) / w) > 0.22 || (Math.abs(drag.dx) / dt) > 0.42) && drag.dir !== 0;
    const ease = "cubic-bezier(0.22, 1, 0.36, 1)";
    if (shouldTurn) {
      const target = state.currentPage + drag.dir;
      if (state.turnAnim === "none") { goToPage(target); return; }
      state.isTurning = true;
      if (drag.dir > 0) {
        layerCurr.style.transition = `transform 260ms ${ease}, opacity 240ms ease`;
        layerCurr.style.transform = state.turnAnim === "slide" ? "translate3d(-100%, 0, 0)" : "translate3d(-22%, 0, 0) rotateY(-82deg)";
        layerCurr.style.opacity = "0.1";
      } else {
        layerPrev.style.transition = `transform 260ms ${ease}`;
        layerPrev.style.transform = "translate3d(0, 0, 0) rotateY(0deg)";
      }
      setTimeout(() => goToPage(target), 250);
    } else {
      layerCurr.style.transition = `transform 300ms ${ease}`; layerPrev.style.transition = `transform 300ms ${ease}`;
      layerCurr.style.transform = "translate3d(0, 0, 0) rotateY(0deg)"; layerPrev.style.transform = "translate3d(-100%, 0, 0)";
      [layerCurr, layerNext, layerPrev].forEach((el) => {
        const l = el.querySelector(".page-lighting"), s = el.querySelector(".page-cast-shadow");
        if (l) l.style.opacity = "0"; if (s) s.style.opacity = "0";
      });
    }
  }, { passive: true });

  // Double-tap empty margin to toggle Dynamic Island mode
  let lastTapTime = 0;
  stageEl.addEventListener("click", (e) => {
    if (e.target.closest("button, a, input, textarea, .uncertain-word, .user-hl, [contenteditable='true']")) return;
    const now = performance.now();
    if (now - lastTapTime < 280) { setHudCollapsed(!state.hudCollapsed); lastTapTime = 0; }
    else lastTapTime = now;
  });

  // =========================================================================
  // HUD, Living Dynamic Island, Progress Bar, Bookmark Jump Pill
  // =========================================================================
  function setHudCollapsed(val) {
    state.hudCollapsed = !!val;
    if (state.hudCollapsed) closeScrubber();
    applyVisualPrefs();
    vibrate(6);
    persistAll();
  }

  function getSortedBookmarkPages() {
    return Object.keys(state.bookmarks).map(Number).filter((n) => n >= 1 && n <= TOTAL).sort((a, b) => a - b);
  }

  function getNextBookmarkPage() {
    const pages = getSortedBookmarkPages();
    if (!pages.length) return null;
    const after = pages.find((p) => p > state.currentPage);
    if (after !== undefined) return after;
    return pages[0] === state.currentPage && pages.length > 1 ? pages[1] : pages[0];
  }

  function updateHud() {
    const pg = PAGES[state.currentPage - 1];
    document.getElementById("top-page-num").textContent = `Стр. ${state.currentPage} / ${TOTAL}`;
    document.getElementById("top-topic").textContent = pg ? pg.title : "";

    // Progress hairline
    const ratio = state.currentPage / Math.max(1, TOTAL);
    document.getElementById("progress-hairline").style.transform = `scaleX(${ratio.toFixed(4)})`;

    // Living Dynamic Island counter + ring + bookmark dot
    document.getElementById("island-page-text").textContent = `${state.currentPage} / ${TOTAL}`;
    const circ = 2 * Math.PI * 9.5;
    const fg = document.getElementById("island-ring-fg");
    if (fg) { fg.style.strokeDasharray = String(circ); fg.style.strokeDashoffset = String(circ * (1 - ratio)); }
    const islandDot = document.getElementById("island-bm-dot");
    const currBm = state.bookmarks[state.currentPage];
    if (currBm) {
      islandDot.style.background = getTagById(currBm.tagId).color;
      islandDot.classList.add("active");
    } else {
      islandDot.classList.remove("active");
    }

    // Working page arrows
    document.getElementById("btn-page-prev").disabled = state.currentPage <= 1;
    document.getElementById("btn-page-next").disabled = state.currentPage >= TOTAL;

    document.getElementById("dock-bookmark").classList.toggle("active", !!currBm);
    const hasNote = !!(state.notes[state.currentPage] && state.notes[state.currentPage].text.trim());
    document.getElementById("dock-note").classList.toggle("has-dot", hasNote);

    // Floating "Go to Bookmark" pill
    const bmJumpPill = document.getElementById("bookmark-jump-pill");
    const bmPages = getSortedBookmarkPages();
    if (bmPages.length > 0) {
      const nextBm = getNextBookmarkPage();
      const tag = getTagById(state.bookmarks[nextBm] && state.bookmarks[nextBm].tagId);
      document.getElementById("bm-jump-dot").style.background = tag.color;
      document.getElementById("bm-jump-text").textContent = nextBm === state.currentPage ? `Закладка · Стр. ${nextBm}` : `К закладке · Стр. ${nextBm}`;
      bmJumpPill.dataset.targetPage = String(nextBm);
      bmJumpPill.classList.add("visible");
    } else {
      bmJumpPill.classList.remove("visible");
    }
  }

  document.getElementById("bookmark-jump-pill").addEventListener("click", (e) => {
    const target = Number(e.currentTarget.dataset.targetPage);
    if (!target) return;
    if (target === state.currentPage) { state.navTab = "bookmarks"; openSheet("nav"); }
    else { goToPage(target); showToast(`Переход к закладке · Стр. ${target}`); }
  });

  // Scrubber
  const scrubberEl = document.getElementById("scrubber-pop");
  const scrubberRange = document.getElementById("scrubber-range");
  const scrubberNum = document.getElementById("scrubber-num");
  const scrubberTitle = document.getElementById("scrubber-title");

  function toggleScrubber() {
    if (scrubberEl.classList.contains("open")) closeScrubber();
    else {
      scrubberRange.max = String(TOTAL); scrubberRange.value = String(state.currentPage);
      scrubberNum.max = String(TOTAL); scrubberNum.value = String(state.currentPage);
      scrubberTitle.textContent = PAGES[state.currentPage - 1]?.title || "";
      scrubberEl.classList.add("open");
    }
  }
  function closeScrubber() { scrubberEl.classList.remove("open"); }

  document.getElementById("scrubber-go").addEventListener("click", () => { goToPage(Number(scrubberNum.value)); closeScrubber(); });

  // Sheets System
  const backdropEl = document.getElementById("sheet-backdrop");
  const sheetEl = document.getElementById("sheet");
  const sheetTitleEl = document.getElementById("sheet-title");
  const sheetBodyEl = document.getElementById("sheet-body");

  function openSheet(type) { closeScrubber(); state.activeSheet = type; backdropEl.classList.add("open"); sheetEl.classList.add("open"); sheetEl.style.transform = ""; renderSheetContent(); }
  function closeSheet() { state.activeSheet = null; backdropEl.classList.remove("open"); sheetEl.classList.remove("open"); sheetEl.style.transform = ""; }
  backdropEl.addEventListener("click", closeSheet);
  document.getElementById("sheet-close").addEventListener("click", closeSheet);

  let sheetDragY = 0, sheetDragging = false;
  const handleArea = document.getElementById("sheet-handle-area");
  handleArea.addEventListener("touchstart", (e) => { sheetDragging = true; sheetDragY = e.touches[0].clientY; sheetEl.style.transition = "none"; }, { passive: true });
  handleArea.addEventListener("touchmove", (e) => { if (!sheetDragging) return; sheetEl.style.transform = `translateX(-50%) translateY(${Math.max(0, e.touches[0].clientY - sheetDragY)}px)`; }, { passive: true });
  handleArea.addEventListener("touchend", (e) => { if (!sheetDragging) return; sheetDragging = false; sheetEl.style.transition = ""; if (e.changedTouches[0].clientY - sheetDragY > 90) closeSheet(); else sheetEl.style.transform = ""; }, { passive: true });

  // =========================================================================
  // Instant Russian Full-Text + Fuzzy Search (<15ms)
  // =========================================================================
  function runSearch(query, filter) {
    const q = normRu(query);
    if (!q) return [];
    const tokens = q.split(" ").filter(Boolean);
    const results = [];
    for (const pg of PAGES) {
      const pnum = pg.page;
      const noteText = (state.notes[pnum] && state.notes[pnum].text) || "";
      let corpus = filter === "all" ? `${pg.title}\n${pg.plain_text}\n${noteText}`
        : filter === "text" ? `${pg.title}\n${pg.plain_text}`
        : filter === "tables" ? (pg.table_text || "") : noteText;
      if (!corpus.trim()) continue;
      const normCorpus = normRu(corpus);
      let score = 0, matchPos = -1;
      const exactIdx = normCorpus.indexOf(q);
      if (exactIdx !== -1) { score += 100; matchPos = exactIdx; }
      else {
        const words = normCorpus.split(/[^a-zа-я0-9]+/).filter(Boolean);
        let matched = 0;
        for (const tok of tokens) {
          const idx = normCorpus.indexOf(tok);
          if (idx !== -1) { matched++; score += 35; if (matchPos === -1) matchPos = idx; }
          else if (tok.length >= 4) {
            const maxDist = tok.length >= 7 ? 2 : 1;
            const found = words.find((w) => Math.abs(w.length - tok.length) <= maxDist && levenshtein(w, tok) <= maxDist);
            if (found) { matched++; score += 18; if (matchPos === -1) matchPos = normCorpus.indexOf(found); }
          }
        }
        if (matched < tokens.length) continue;
      }
      const start = Math.max(0, matchPos - 42), end = Math.min(corpus.length, matchPos + q.length + 76);
      const snippet = (start > 0 ? "…" : "") + corpus.slice(start, end).replace(/\n+/g, " ") + (end < corpus.length ? "…" : "");
      const pat = escapeHtml(query.trim()).replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/[еёЕЁ]/g, "[еёЕЁ]");
      let snippetHtml = escapeHtml(snippet);
      try { snippetHtml = snippetHtml.replace(new RegExp(`(${pat})`, "gi"), '<mark class="search-hit">$1</mark>'); } catch (_) {}
      results.push({ page: pnum, title: pg.title, score, snippetHtml });
    }
    results.sort((a, b) => b.score - a.score || a.page - b.page);
    return results;
  }

  function updateSearchMatchesOnCurrentPage(scrollToFirst) {
    const marks = Array.from(layerCurr.querySelectorAll("mark.search-hit"));
    state.matchCount = marks.length;
    const bar = document.getElementById("match-bar");
    if (!state.activeSearchTerm || !marks.length) { bar.classList.remove("visible"); return; }
    state.matchIndex = Math.max(0, Math.min(marks.length - 1, state.matchIndex));
    marks.forEach((m, i) => m.classList.toggle("is-active", i === state.matchIndex));
    document.getElementById("match-counter").textContent = `${state.matchIndex + 1} из ${marks.length}`;
    bar.classList.add("visible");
    if (scrollToFirst && marks[state.matchIndex]) marks[state.matchIndex].scrollIntoView({ behavior: "smooth", block: "center" });
  }

  document.getElementById("match-prev").addEventListener("click", () => { if (state.matchCount > 0) { state.matchIndex = (state.matchIndex - 1 + state.matchCount) % state.matchCount; updateSearchMatchesOnCurrentPage(true); } });
  document.getElementById("match-next").addEventListener("click", () => { if (state.matchCount > 0) { state.matchIndex = (state.matchIndex + 1) % state.matchCount; updateSearchMatchesOnCurrentPage(true); } });
  document.getElementById("match-close").addEventListener("click", () => { state.activeSearchTerm = ""; state.matchCount = 0; document.getElementById("match-bar").classList.remove("visible"); renderStack(); });

  // =========================================================================
  // Sheet Renderers
  // =========================================================================
  function renderSheetContent() {
    if (state.activeSheet === "search") {
      sheetTitleEl.textContent = "Поиск по тетради";

      sheetBodyEl.innerHTML = `
        <div class="search-input-wrap">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search-field" type="search" placeholder="Слово, термин, страна, формула..." value="${escapeHtml(state.searchQuery)}" autocomplete="off" />
          ${state.searchQuery ? '<button id="search-clear" class="mini-action-btn">Очистить</button>' : ""}
        </div>
        <div class="chip-row">${filters.map((f) => `<button class="filter-chip ${state.searchFilter === f.id ? "active" : ""}" data-sfilter="${f.id}">${f.label}</button>`).join("")}</div>

      const input = document.getElementById("search-field");
      const updateResults = () => {
        state.searchQuery = input.value;
        const area = document.getElementById("search-results-area");
        if (!state.searchQuery.trim()) {
          if (state.searchHistory.length) {
            area.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span class="setting-label" style="margin:0">Недавние запросы</span><button class="mini-action-btn" id="clear-shist">Очистить</button></div><div class="chip-row">${state.searchHistory.map((h) => `<button class="filter-chip" data-shist="${escapeHtml(h)}">${escapeHtml(h)}</button>`).join("")}</div>`;
            const clr = document.getElementById("clear-shist");
            if (clr) clr.addEventListener("click", () => { state.searchHistory = []; persistAll(); updateResults(); });

      } else {

      sheetBodyEl.querySelectorAll("[data-navtab]").forEach((b) => b.addEventListener("click", () => { state.navTab = b.dataset.navtab; renderSheetContent(); }));

    if (state.activeSheet === "bookmarkTag") {

          </div>
        </div>
        <div class="setting-group">
          <div class="setting-label">Управление (всё сохраняется локально)</div>
          <div class="setting-card">
            <div class="setting-row"><span>Перелистывание свайпом</span><button class="toggle-switch ${state.swipeEnabled ? "on" : ""}" data-toggle="swipeEnabled"></button></div>
            <div class="setting-row"><span>Тап-зоны по краям экрана</span><button class="toggle-switch ${state.tapZones ? "on" : ""}" data-toggle="tapZones"></button></div>
            <div class="setting-row"><span>Автоскрытие в Dynamic Island</span><button class="toggle-switch ${state.autoHideHud ? "on" : ""}" data-toggle="autoHideHud"></button></div>
            <div class="setting-row"><span>Экономия энергии (простое стекло)</span><button class="toggle-switch ${state.reducedFx ? "on" : ""}" data-toggle="reducedFx"></button></div>
            <div class="setting-row"><span>Тактильный отклик</span><button class="toggle-switch ${state.haptics ? "on" : ""}" data-toggle="haptics"></button></div>
          </div>
        </div>
        <div class="setting-group">
          <div class="setting-label">Резервная копия (JSON)</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button id="act-export-json" class="btn-secondary" style="flex:1">Экспортировать</button>
            <button id="act-import-json" class="btn-secondary" style="flex:1">Импортировать</button>
            <input type="file" id="import-file-input" accept="application/json" style="display:none" />
          </div>
          <div style="font-size:11.5px;color:var(--ink-muted);margin-top:10px;text-align:center">
            Цифровая тетрадь · Living Liquid Glass v${APP_VERSION} · ${TOTAL} стр.
          </div>
        </div>`;

      sheetBodyEl.querySelectorAll("[data-theme-set]").forEach((b) => b.addEventListener("click", () => { state.theme = b.dataset.themeSet; applyVisualPrefs(); persistAll(); renderSheetContent(); }));
      sheetBodyEl.querySelectorAll("[data-ruling-set]").forEach((b) => b.addEventListener("click", () => { state.ruling = b.dataset.rulingSet; applyVisualPrefs(); persistAll(); renderSheetContent(); }));
      sheetBodyEl.querySelectorAll("[data-anim-set]").forEach((b) => b.addEventListener("click", () => { state.turnAnim = b.dataset.animSet; persistAll(); renderSheetContent(); }));
      document.getElementById("set-fontsize").addEventListener("input", (e) => { state.fontSize = Number(e.target.value); applyVisualPrefs(); persistAll(); });
      document.getElementById("set-lh").addEventListener("input", (e) => { state.lineHeight = Number(e.target.value); applyVisualPrefs(); persistAll(); });
      document.getElementById("set-dim").addEventListener("input", (e) => { state.dimness = Number(e.target.value); applyVisualPrefs(); persistAll(); });
      sheetBodyEl.querySelectorAll("[data-toggle]").forEach((b) => b.addEventListener("click", () => { const k = b.dataset.toggle; state[k] = !state[k]; applyVisualPrefs(); persistAll(); renderSheetContent(); }));
      document.getElementById("act-show-orig").addEventListener("click", () => { closeSheet(); openOriginalPhoto(state.currentPage); });
      document.getElementById("act-toggle-hl").addEventListener("click", () => { state.hlMode = !state.hlMode; document.getElementById("hl-bar").classList.toggle("visible", state.hlMode); if (state.hlMode) showToast("Выделите фразу и выберите цвет маркера"); closeSheet(); });
      document.getElementById("act-toggle-edit").addEventListener("click", () => { state.editMode = !state.editMode; renderStack(); closeSheet(); });
      document.getElementById("act-export-json").addEventListener("click", exportBackup);
      document.getElementById("act-import-json").addEventListener("click", () => document.getElementById("import-file-input").click());
      document.getElementById("import-file-input").addEventListener("change", importBackup);
    }
  }

  // =========================================================================
  // Original Photo Lightbox & Export/Import
  // =========================================================================
  const photoModal = document.getElementById("photo-modal");
  const photoImg = document.getElementById("photo-img");
  const photoFallback = document.getElementById("photo-fallback");
  const photoTitle = document.getElementById("photo-title");

  function openOriginalPhoto(pageNum) {
    const pg = PAGES[pageNum - 1]; if (!pg) return;
    state.photoZoom = 1; photoImg.style.transform = "scale(1)"; photoImg.style.display = "block"; photoFallback.style.display = "none";
    photoTitle.textContent = `Оригинал · Стр. ${pageNum} (${pg.source_filename || ""})`;
    photoImg.onerror = () => { photoImg.style.display = "none"; photoFallback.style.display = "block"; };
    photoImg.src = pg.original_webp || `originals/page_${String(pageNum).padStart(2, "0")}.webp`;
    photoModal.classList.add("open");
  }
  document.getElementById("photo-close").addEventListener("click", () => photoModal.classList.remove("open"));
  document.getElementById("photo-zoom-in").addEventListener("click", () => { state.photoZoom = Math.min(3, state.photoZoom + 0.4); photoImg.style.transform = `scale(${state.photoZoom})`; });
  document.getElementById("photo-zoom-out").addEventListener("click", () => { state.photoZoom = Math.max(1, state.photoZoom - 0.4); photoImg.style.transform = `scale(${state.photoZoom})`; });

  function exportBackup() {
    const blob = new Blob([JSON.stringify({ app: "Tetrad_Konspekt_Liquid_Glass", version: APP_VERSION, exportedAt: new Date().toISOString(), ...buildPersistedSnapshot() }, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob); const a = document.createElement("a");
    a.href = url; a.download = `tetrad_backup_${new Date().toISOString().slice(0, 10)}.json`; a.click(); URL.revokeObjectURL(url);
    showToast("Резервная копия сохранена");
  }
  function importBackup(e) {
    const file = e.target.files && e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const d = JSON.parse(String(reader.result || "{}"));
        ["bookmarks", "customTags", "notes", "highlights", "edits", "wordFixes", "searchHistory", "scrollPositions"].forEach((k) => { if (d[k]) state[k] = d[k]; });
        if (d.currentPage) state.currentPage = Math.max(1, Math.min(TOTAL, Number(d.currentPage)));
        persistAll(); applyVisualPrefs(); renderStack(); closeSheet(); showToast("Данные восстановлены");
      } catch (_) { showToast("Ошибка чтения файла"); }
    };
    reader.readAsText(file);
  }

  // =========================================================================
  // Delegated Page Events & Controls
  // =========================================================================
  stageEl.addEventListener("click", (e) => {
    const copyPageBtn = e.target.closest("[data-copy-page]");
    if (copyPageBtn) { const p = Number(copyPageBtn.dataset.copyPage), pg = PAGES[p - 1]; if (pg) copyText(`${pg.title}\n\n${pg.plain_text}`, `Текст стр. ${p} скопирован`); return; }
    const copyTblBtn = e.target.closest("[data-copy-table]");
    if (copyTblBtn) {
      const pg = PAGES[state.currentPage - 1], tbl = pg && pg.blocks[Number(copyTblBtn.dataset.copyTable)];
      if (tbl && tbl.type === "table") {
        const head = (tbl.headers || []).map((h) => typeof h === "object" ? h.text : h).join("\t");
        const body = (tbl.rows || []).map((r) => r.map((c) => typeof c === "object" ? c.text : c).join("\t")).join("\n");
        copyText((head ? head + "\n" : "") + body, "Таблица скопирована");
      }
      return;
    }
    if (e.target.closest("[data-open-note]")) { openSheet("notes"); return; }
    if (e.target.closest("[data-ribbon-page]")) { openSheet("bookmarkTag"); return; }
    const unc = e.target.closest(".uncertain-word");
    if (unc) { state.pendingUncertain = { page: Number(unc.dataset.page), orig: unc.dataset.uncertain }; openSheet("uncertainFix"); return; }
    const hlMark = e.target.closest("mark.user-hl");
    if (hlMark && state.hlMode) {
      state.highlights[state.currentPage] = (state.highlights[state.currentPage] || []).filter((h) => h.text !== hlMark.dataset.hlText);
      persistAll(); renderStack(); showToast("Выделение снято"); return;
    }
    const resetEd = e.target.closest("[data-reset-edits]");
    if (resetEd) { delete state.edits[Number(resetEd.dataset.resetEdits)]; persistAll(); renderStack(); showToast("Исходный текст восстановлен"); return; }
    if (e.target.closest("[data-finish-edit]")) { state.editMode = false; renderStack(); showToast("Правки сохранены локально"); }
  });

  stageEl.addEventListener("input", (e) => {
    const ed = e.target.closest("[data-editable-block]"); if (!ed) return;
    if (!state.edits[state.currentPage]) state.edits[state.currentPage] = {};
    state.edits[state.currentPage][Number(ed.dataset.editableBlock)] = ed.innerText;
    persistAll();
  });

  document.querySelectorAll(".hl-swatch").forEach((sw) => sw.addEventListener("click", () => {
    const sel = window.getSelection ? window.getSelection().toString().trim() : "";
    if (!sel || sel.length < 2) { showToast("Сначала выделите фрагмент текста"); return; }
    const p = state.currentPage; if (!state.highlights[p]) state.highlights[p] = [];
    state.highlights[p].push({ text: sel, color: sw.dataset.hlColor });
    if (window.getSelection) window.getSelection().removeAllRanges();
    persistAll(); renderStack(); showToast("Выделено маркером");
  }));
  document.getElementById("hl-close").addEventListener("click", () => { state.hlMode = false; document.getElementById("hl-bar").classList.remove("visible"); });

  document.getElementById("top-hud-main").addEventListener("click", toggleScrubber);
  document.getElementById("btn-page-prev").addEventListener("click", () => animateTurn(-1));
  document.getElementById("btn-page-next").addEventListener("click", () => animateTurn(1));
  document.getElementById("dock-search").addEventListener("click", () => openSheet("search"));
  document.getElementById("dock-nav").addEventListener("click", () => openSheet("nav"));
  document.getElementById("dock-scrubber").addEventListener("click", toggleScrubber);
  document.getElementById("dock-bookmark").addEventListener("click", () => {
    const p = state.currentPage;
    if (!state.bookmarks[p]) { state.bookmarks[p] = { tagId: "important", createdAt: Date.now() }; vibrate(12); persistAll(); renderStack(); showToast("Закладка добавлена"); }
    else openSheet("bookmarkTag");
  });
  document.getElementById("dock-note").addEventListener("click", () => openSheet("notes"));
  document.getElementById("dock-settings").addEventListener("click", () => openSheet("settings"));
  document.getElementById("dock-collapse").addEventListener("click", () => setHudCollapsed(true));
  document.getElementById("dynamic-island").addEventListener("click", () => setHudCollapsed(false));
  document.getElementById("tap-left").addEventListener("click", () => animateTurn(-1));
  document.getElementById("tap-right").addEventListener("click", () => animateTurn(1));

  document.addEventListener("keydown", (e) => {
    if (state.activeSheet || state.editMode) { if (e.key === "Escape") closeSheet(); return; }
    if (e.key === "ArrowRight") animateTurn(1);
    else if (e.key === "ArrowLeft") animateTurn(-1);
    else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openSheet("search"); }
  });

  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.protocol === "http:")) {
    window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(() => {}); });
  }

  // Instant Zero-Flash Synchronous Bootstrap + Async IDB Hydrate
  hydrateSyncFirst();
  applyVisualPrefs();
  renderStack();
  hydrateFromIDB().then((changed) => { if (changed) { applyVisualPrefs(); renderStack(); } });
})();

  </script>
</body>
</html>
