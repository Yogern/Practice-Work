:root {

  --glass-bg: rgba(255, 255, 255, 0.16);

.is-editing [data-block-idx] { outline: 1px dashed var(--accent); outline-offset: 3px; border-radius: 6px; }
.edit-banner { display: none; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; margin-bottom: 12px; border-radius: 12px; background: var(--accent-soft); border: 0.75px solid var(--callout-border); font-size: 12.5px; color: var(--accent-ink); }

.tap-zone { position: fixed; top: 72px; bottom: 92px; width: 44px; z-index: 12; display: none; pointer-events: auto; }

.tap-zone.right { right: 0; }
[data-tap-zones="true"] .tap-zone { display: block; }

/* ==========================================================================

   ========================================================================== */
.top-hud {
  position: fixed;
  top: calc(10px + var(--sat));
  left: 50%;
  transform: translate3d(-50%, 0, 0);
  width: min(calc(100% - 22px), 680px);
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 5px 7px 5px 10px;

  contain: layout style;
}

[data-hud="collapsed"] .top-hud {
  transform: translate3d(-50%, calc(-100% - 24px), 0) scale(0.92);
  opacity: 0;
  pointer-events: none;
}

.top-hud-main { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; cursor: pointer; }
.top-page-pill { flex-shrink: 0; font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); }
.top-topic-title { font-size: 12.5px; font-weight: 600; color: var(--ink-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 6px rgba(255,255,255,0.45); }
[data-theme="oled"] .top-topic-title { text-shadow: 0 1px 6px rgba(0,0,0,0.65); }
.top-hud-right { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }

.icon-btn-sm {
  width: 34px;

  align-items: center;

  background: rgba(128, 128, 128, 0.12);
  transition: background 140ms ease, transform 140ms var(--spring-snappy);
}

.icon-btn-sm:active { transform: scale(0.88); }
.icon-btn-sm:disabled { opacity: 0.28; pointer-events: none; background: transparent; }

.match-bar { position: fixed; top: calc(60px + var(--sat)); left: 50%; transform: translate3d(-50%, 0, 0) scale(0.92); opacity: 0; pointer-events: none; z-index: 41; display: flex; align-items: center; gap: 8px; padding: 5px 10px 5px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; transition: transform 240ms var(--spring-snappy), opacity 200ms ease; }

/* ==========================================================================

.bottom-dock-wrap {
  position: fixed;
  left: 0; right: 0;
  bottom: calc(12px + var(--sab));
  z-index: 45;
  display: flex;
  justify-content: center;
  pointer-events: none;
  padding: 0 10px;
}

.bottom-dock {
  pointer-events: auto;

  border-radius: 999px;

  transition: transform 400ms var(--spring-fluid), opacity 240ms ease;
  contain: layout style;
}

[data-hud="collapsed"] .bottom-dock {
  transform: translate3d(0, 48px, 0) scale(0.45);
  opacity: 0;
  pointer-events: none;

.dock-btn {
  min-width: 44px;
  height: 44px;

  justify-content: center;

}

.dock-btn.has-dot .dot-indicator { display: block; }
.dock-divider { width: 1px; height: 22px; background: var(--border-subtle); margin: 0 2px; }

/* GPU-ONLY Living Dynamic Island Droplet (Zero Repaint, 120 FPS!) */
@keyframes island-float {
  0%, 100% { transform: translate3d(-50%, 0, 0) scale(1, 1); }
  50% { transform: translate3d(-50%, -2.5px, 0) scale(1.02, 0.985); }
}

.dynamic-island {
  position: fixed;
  left: 50%;
  bottom: calc(14px + var(--sab));
  z-index: 46;
  height: 48px;
  padding: 0 16px 0 12px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  font-size: 13.5px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--ink-primary);
  background: var(--glass-bg-drop);
  -webkit-backdrop-filter: var(--glass-backdrop-webkit);
  backdrop-filter: var(--drop-backdrop);
  border: 0.9px solid var(--glass-border-lo);
  border-top-color: var(--glass-border-hi);
  border-left-color: var(--glass-border-hi);
  box-shadow: var(--glass-rim), 0 14px 34px -6px rgba(15, 23, 42, 0.26);
  transform: translate3d(-50%, 34px, 0) scale(0.55);
  opacity: 0;
  pointer-events: none;
  transition: transform 420ms var(--spring-bounce), opacity 240ms ease;
  isolation: isolate;
  contain: layout style;
}

.dynamic-island::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(180deg, rgba(255,255,255,0.42) 0%, rgba(255,255,255,0.04) 45%, rgba(255,255,255,0.18) 100%);
  pointer-events: none;
}

[data-hud="collapsed"] .dynamic-island {
  transform: translate3d(-50%, 0, 0) scale(1);
  opacity: 1;
  pointer-events: auto;
  animation: island-float 4.8s ease-in-out infinite;
}

.dynamic-island:active {
  animation: none !important;
  transform: translate3d(-50%, 0, 0) scale(0.92) !important;
}

.island-ring { width: 24px; height: 24px; transform: rotate(-90deg); flex-shrink: 0; }
.island-ring-bg { stroke: var(--border-strong); fill: none; stroke-width: 2.5; }
.island-ring-fg { stroke: var(--accent); fill: none; stroke-width: 2.5; stroke-linecap: round; transition: stroke-dashoffset 300ms var(--spring-fluid); }
.island-bm-dot { width: 7px; height: 7px; border-radius: 50%; display: none; }
.island-bm-dot.active { display: inline-block; }

.search-input-wrap { display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 44px; border-radius: 14px; background: var(--bg-paper-elevated); border: 1px solid var(--border-strong); margin-bottom: 10px; }

  .pages-grid { grid-template-columns: repeat(3, 1fr); }
}

  <script>
window.__KONSPEKT_PAGES__ = [{"page": 1, "date": "3.09.2026", "title": "География в системе наук", "source_filename": "IMG_20261124_201138.webp", "captured_at_ms": "2026-11-24 20:11:40.073", "original_webp": "originals/page_01.webp", "blocks": [{"type": "heading", "level": 1, "text": "География в системе наук."}, {"type": "definition", "term": "География", "text": "это комплекс наук, изучающих природные условия Земли, население, хозяйство и пространственные взаимосвязи между ними."}, {"type": "paragraph", "text": "География отвечает на вопросы: где расположен объект? какие природные условия характерны для территории? Кто проживает на данной территории? Какие предприятия находятся рядом? Как связаны между собой населённые пункты, дороги, электростанции?"}, {"type": "paragraph", "text": "География изучает не только отдельные объекты, но и их размещение на территории. Например, электрическая подстанция может быть технически исправной, но её строительство невозможно оценить только по проекту оборудования."}, {"type": "heading", "level": 2, "text": "Необходимо учитывать:"}, {"type": "list", "ordered": false, "items": ["Рельеф участка", "Состояние грунта", "Уровень грунтовых вод", "Близость жилых домов", "Наличие подъездной дороги", "Расстояние до линии электропередачи.", "Возможность подключения потребителей"]}], "uncertain_words": [], "plain_text": "География в системе наук.\nГеография — это комплекс наук, изучающих природные условия Земли, население, хозяйство и пространственные взаимосвязи между ними.\nГеография отвечает на вопросы: где расположен объект? какие природные условия характерны для территории? Кто проживает на данной территории? Какие предприятия находятся рядом? Как связаны между собой населённые пункты, дороги, электростанции?\nГеография изучает не только отдельные объекты, но и их размещение на территории. Например, электрическая подстанция может быть технически исправной, но её строительство невозможно оценить только по проекту оборудования.\nНеобходимо учитывать:\nРельеф участка\nСостояние грунта\nУровень грунтовых вод\nБлизость жилых домов\nНаличие подъездной дороги\nРасстояние до линии электропередачи.\nВозможность подключения потребителей", "table_text": ""}, {"page": 2, "date": null, "title": "Основные разделы географии", "source_filename": "IMG_20261124_201156.webp", "captured_at_ms": "2026-11-24 20:11:58.042", "original_webp": "originals/page_02.webp", "blocks": [{"type": "paragraph", "text": "Таким образом, электромонтажник должен понимать не только устройство электроустановки, но и особенности территории, на которой она размещается."}, {"type": "heading", "level": 2, "text": "Основные разделы географии:"}, {"type": "list", "ordered": false, "items": ["Физическая география изучает природные компоненты и природные комплексы: рельеф, климат, растительность, природные зоны, {{?остальные}} природные зоны. Практическое значение: физико-географические условия влияют на тип опор, глубину прокладки кабеля, способ защиты электрооборудования, сроки и технологии выполнения работ, устойчивость конструкции, безопасность работников. Пример: горная территория — при прокладке воздушной линии в горной местности необходимо учитывать: крутые склоны, каменистый грунт, опасность обвалов, сложность доставки опор и материалов, возможность повреждения линии при сходе снежных лавин. И вот в таких условиях может потребоваться укрепление оснований и применение дополнительной защиты.", "Социально-экономическая география изучает население, населённые пункты, транспорт, промышленность, сельское хозяйство и другие виды хозяйственной деятельности. Для электромонтажника большое значение имеет плотность населения, расположение жилых районов,"]}], "uncertain_words": [{"word": "{{?остальные}}", "context": "рельеф, климат, растительность, природные зоны, {{?остальные}} природные зоны"}], "plain_text": "Таким образом, электромонтажник должен понимать не только устройство электроустановки, но и особенности территории, на которой она размещается.\nОсновные разделы географии:\nФизическая география изучает природные компоненты и природные комплексы: рельеф, климат, растительность, природные зоны, {{?остальные}} природные зоны. Практическое значение: физико-географические условия влияют на тип опор, глубину прокладки кабеля, способ защиты электрооборудования, сроки и технологии выполнения работ, устойчивость конструкции, безопасность работников. Пример: горная территория — при прокладке воздушной линии в горной местности необходимо учитывать: крутые склоны, каменистый грунт, опасность обвалов, сложность доставки опор и материалов, возможность повреждения линии при сходе снежных лавин. И вот в таких условиях может потребоваться укрепление оснований и применение дополнительной защиты.\nСоциально-экономическая география изучает население, населённые пункты, транспорт, промышленность, сельское хозяйство и другие виды хозяйственной деятельности. Для электромонтажника большое значение имеет плотность населения, расположение жилых районов,", "table_text": ""}, {"page": 3, "date": null, "title": "Традиционные и новые методы в географии", "source_filename": "IMG_20261124_201214.webp", "captured_at_ms": "2026-11-24 20:12:15.061", "original_webp": "originals/page_03.webp", "blocks": [{"type": "paragraph", "text": "размещение, наличие объектов."}, {"type": "heading", "level": 1, "text": "Традиционные и новые методы в географии. Географическая практика. Географические культуры."}, {"type": "table", "caption": "Традиционные методы географии", "continued_from_prev": false, "continues_to_next": false, "headers": ["Методы", "Суть", "Пример для электромонтажников"], "rows": [["Картографический", "Анализ карт, планов и схем местности", "Поиск чужих подземных коммуникаций на генплане перед рытьём траншеи под силовой кабель."], ["Сравнительно-географический", "Сопоставление", "Сравнение условий прокладки ЛЭП в разных районах и выбор оптимальной трассы."], ["Экспедиционный (полевой)", "Непосредственное изучение территории на мест е методы\nСовременная\nТочность\nСредняя\nБольшая\nВремя / затраты\nБольшое, т.к. нужен выезд\nМалое, т.к. новые технологии {{?легче}}.\nСтоимость\nДешёво\nДорого, но окупается за счёт предупреждения аварий.\nУчёт скрытых факторов\nОтсутствует / учёт по бумагам\nЕсть, радар видит пустоты / мониторинг в реальном времени"}, {"page": 6, "date": null, "title": "Эссе: Как изменится работа электромонтажника через 20 лет с развитием космической географии", "source_filename": "IMG_20261124_201252.webp", "captured_at_ms": "2026-11-24 20:12:52.788", "original_webp": "originals/page_06.webp", "blocks": [{"type": "marginalia", "text": "Д/з: написать ЭССЕ на тему: «Как изменится работа электромонтажника с развитием космической географии через 20 лет»."}, {"type": "heading", "level": 1, "text": "ЭССЕ"}, {"type": "heading", "level": 2, "text": "«Как изменится работа электромонтажника через 20 лет с развитием космической географии»"}, {"type": "paragraph", "text": "Через 20 лет развитие космической географии — картографирование и освоение орбит, Луны и пояса астероидов — выведет профессию электромонтажника за пределы Земли."}, {"type": "paragraph", "text": "Рабочими зонами специалиста станут не жилые дома, а лунные базы, орбитальные верфи и геостационарные солнечные электростанции. Физический монтаж кабелей уступит место работе со сверхпроводниками, лазерной передачей энергии и обслуживанию микрореакторов в условиях вакуума и радиации. Инструменты кардинально изменятся: пассатижи и перфораторы заменят дистанционно управляемые дроны-манипуляторы и экзоскелеты."}, {"type": "paragraph", "text": "Электромонтажник будущего — это сплав инженера, робототехника и космонавта. Знание космической географии позволит ему ориентироваться в топографии планет, учитывать солнечную активность и строить надёжные энергосети в экстремальных межпланетных условиях."}], "uncertain_words": [], "plain_text": "Д/з: написать ЭССЕ на тему: «Как изменится работа электромонтажника с развитием космической географии через 20 лет».\nЭССЕ\n«Как изменится работа электромонтажника через 20 лет с развитием космической географии»\nЧерез 20 лет развитие космической географии — картографирование и освоение орбит, Луны и пояса астероидов — выведет профессию электромонтажника за пределы Земли.\nРабочими зонами специалиста станут не жилые дома, а лунные базы, орбитальные верфи и геостационарные солнечные электростанции. Физический монтаж кабелей уступит место работе со сверхпроводниками, лазерной передачей энергии и обслуживанию микрореакторов в условиях вакуума и радиации. Инструменты кардинально изменятся: пассатижи и перфораторы заменят дистанционно управляемые дроны-манипуляторы и экзоскелеты.\nЭлектромонтажник будущего — это сплав инженера, робототехника и космонавта. Знание космической географии позволит ему ориентироваться в топографии планет, учитывать солнечную активность и строить надёжные энергосети в экстремальных межпланетных условиях.", "table_text": ""}, {"page": 7, "date": "10.09.2026", "title": "Географическая среда. Естественный и антропогенный ландшафт", "source_filename": "IMG_20261124_201306.webp", "captured_at_ms": "2026-11-24 20:13:08.606", "original_webp": "originals/page_07.webp", "blocks": [{"type": "heading", "level": 1, "text": "Географическая среда"}, {"type": "heading", "level": 2, "text": "Естественный и антропогенный ландшафт."}, {"type": "definition", "term": "Географическая среда", "text": "это та часть земной природы, с которой общество непосредственно взаимодействует в своей жизни и в производственной деятельности."}, {"type": "callout", "label": "Состав", "text": "Литосфера (это земля), гидросфера (это вода), атмосфера (это воздух), биосфера (это живые организмы)."}, {"type": "definition", "term": "Ландшафт", "text": "это сформировавшийся под воздействием природы (это тайга, тундра, тропический лес, горные)."}, {"type": "paragraph", "text": "Признаки: сохранился естественный ландшафт, антропогенный ландшафт — это бывший природный ландшафт."}, {"type": "heading", "level": 2, "text": "Классификация антропогенных:"}, {"type": "list", "ordered": false, "items": ["Сельскохозяйственные (агрокультурные)", "Промышленные (карьеры, шахты, заводы).", "Городские (селитебные) — города, посёлки, водохозяйственные", "Рекреационные: санатории, зоны отдыха."]}], "uncertain_words": [], "plain_text": "Географическая среда\nЕстественный и антропогенный ландшафт.\nГеографическая среда — это та часть земной природы, с которой общество непосредственно взаимодействует в своей жизни и в производственной деятельности.\nСостав: Литосфера (это земля), гидросфера (это вода), атмосфера (это воздух), биосфера (это живые организмы).\nЛандшафт — это сформировавшийся под воздействием природы (это тайга, тундра, тропический лес, горные).\nПризнаки: сохранился естественный ландшафт, антропогенный ландшафт — это бывший природный ландшафт.\nКлассификация антропогенных:\nСельскохозяйственные (агрокультурные)\nПромышленные (карьеры, шахты, заводы).\nГородские (селитебные) — города, посёлки, водохозяйственные\nРекреационные: санатории, зоны отдыха.", "table_text": ""}, {"page": 8, "date": null, "title": "Заброшенный карьер. Социально-экономическая география", "source_filename": "IMG_20261124_201314.webp", "captured_at_ms": "2026-11-24 20:13:15.676", "original_webp": "originals/page_08.webp", "blocks": [{"type": "heading", "level": 2, "text": "Заброшенный карьер"}, {"type": "paragraph", "text": "«Это огромная воронка в земле, оставшаяся после добычи полезных ископаемых (сырья), стенки карьера осыпаются. Дно заросло кустарником и заполнилось дождевой водой. Рядом вырос молодой лесок.»"}, {"type": "paragraph", "text": "Это естественно-антропогенный ландшафт."}, {"type": "paragraph", "text": "Сам карьер возник в результате деятельности человека, который уничтожил первоначальный вид местности."}, {"type": "paragraph", "text": "А то, что на дне скопилась вода и заросли кустарниками и лесом — это естественный процесс природы самовосстановления {{?со временем}}."}, {"type": "heading", "level": 1, "text": "Социально-экономическая география."}, {"type": "paragraph", "text": "Что изучает социально-экономическая география?"}, {"type": "list", "ordered": true, "items": ["Социально-экономическая география изучает население, населённые пункты, транспорт, промышленность, сельское хозяйство и другие виды хозяйственной деятельности.", "Основные направления: география населения, промышленности, сельского хозяйства, транспорта и сферы услуг."]}], "uncertain_words": [{"word": "{{?со временем}}", "context": "это естественный процесс природы самовосстановления {{?со временем}}."}], "plain_text": "Заброшенный карьер\n«Это огромная воронка в земле, оставшаяся после добычи полезных ископаемых (сырья), стенки карьера осыпаются. Дно заросло кустарником и заполнилось дождевой водой. Рядом вырос молодой лесок.»\nЭто естественно-антропогенный ландшафт.\nСам карьер возник в результате деятельности человека, который уничтожил первоначальный вид местности.\nА то, что на дне скопилась вода и заросли кустарниками и лесом — это естественный процесс природы самовосстановления {{?со временем}}.\nСоциально-экономическая география.\nЧто изучает социально-экономическая география?\nСоциально-экономическая география изучает население, населённые пункты, транспорт, промышленность, сельское хозяйство и другие виды хозяйственной деятельности.\nОсновные направления: география населения, промышленности, сельского хозяйства, транспорта и сферы услуг.", "table_text": ""}, {"page": 9, "date": null, "title": "Практическая работа. Входная проверочная работа по географии для студентов 1 курса", "source_filename": "IMG_20261124_201337.webp", "captured_at_ms": "2026-11-24 20:13:38.331", "original_webp": "originals/page_09.webp", "blocks": [{"type": "heading", "level": 1, "text": "Практическая работа."}, {"type": "heading", "level": 2, "text": "Входная проверочная работа по географии для студентов 1 курса."}, {"type": "list", "ordered": false, "items": ["1.", "2. 3", ые сосняки и дубравы."]]}], "uncertain_words": [], "plain_text": "Практическая работа № 1.\nКлассификация ландшафтов г. Нижнекамска\nМетодические указания.\nЦель работы: изучить и классифицировать природные и антропогенные ландшафты г. Нижнекамска.\nКлассификация ландшафтов г. Нижнекамска\nТип ландшафта\nПример (конкретный объект / территория)\nСтепень трансформации\nХарактерные признаки\nСелитебный\nЖилые районы города (многоэтажная и частная застройка).\nСильная (высокая)\nНаличие асфальтированных покрытий, почвы — экранозёмы и культурозёмы, растительность представлена искусственными насаждениями (газоны, парки, скверы).\nПромышленный\nНижнекамский промышленный узел (ПАО «Нижнекамскнефтехим», шинный завод).\nСильная (высокая)\nТехногенный рельеф (насыпи, промплощадки), почвы — урбанозёмы и индустриозёмы с примесью строительного мусора, естественный покров полностью уничтожен.\nВодохозяйственный\nНижнекамское водохранилище на р. Кама.\nУмеренная (водный антропогенный)\nКрупный искусственный водоём, сформированная водная растительность (тростник, рогоз), трансформированные островные сосняки и дубравы.", "table_text": "Классификация ландшафтов г. Нижнекамска\nТип ландшафта\nПример (конкретный объект / территория)\nСтепень трансформации\nХарактерные признаки\nСелитебный\nЖилые районы города (многоэтажная и частная застройка).\nСильная (высокая)\nНаличие асфальтированных покрытий, почвы — экранозёмы и культурозёмы, растительность представлена искусственными насаждениями (газоны, парки, скверы).\nПромышленный\nНижнекамский промышленный узел (ПАО «Нижнекамскнефтехим», шинный завод).\nСильная (высокая)\nТехногенный рельеф (насыпи, промплощадки), почвы — урбанозёмы и индустриозёмы с примесью строительного мусора, естественный покров полностью уничтожен.\nВодохозяйственный\nНижнекамское водохранилище на р. Кама.\nУмеренная (водный антропогенный)\nКрупный искусственный водоём, сформированная водная растительность (тростник, рогоз), трансформированные островные сосняки и дубравы."}, {"page": 11, "date": null, "title": "Классификация ландшафтов г. Нижнекамска (продолжение таблицы)", "source_filename": "IMG_20261124_201407.webp", "captured_at_ms": "2026-11-24 20:14:08.776", "original_webp": "originals/page_11.webp", "blocks": [{"type": "table", "caption": "Классификация ландшафтов г. Нижнекамска (продолжение)", "continued_from_prev": true, "continues_to_next": false, "headers": ["Тип ландшафта", "Пример (конкретный объект / территория)", "Степень трансформации", "Характерные признаки"], "rows": [["Лесохозяйственный", "Лесные массивы в окрестностях города", "Умеренная", "Широколиственные и хвойные леса со значительной долей вторичных мелколиственных пород (берёза, осина), используемые в хозяйстве."], ["Рекреационный", "Комплекс «Святой ключ»", "Умеренная", "Благоустроенный лесной массив на склоне (лестницы, набережная), сохранена природная основа из хвойных и лиственных пород."], ["Сельскохозяйственный", "Сельхозугодья в окрестностях города (пашни, поля).", "Умеренная", "Естественная растительность заменена культурными посевами, почвы распаханы (чернозёмы, серые лесные)."], ["Линейно-дорожный", "Сеть авто- и железных дорог, коридоры ЛЭП.", "Сильная (высокая)", "Сплошное техногенное покрытие полотна, естественный почвенно-растительный покров полностью снят или замещён насыпями."], ["Природный (охраняемый)", "Памятник природы «Борковская дача»", "Слабая", "Естественный пойменный рельеф с дюнами, высокое биоразнообразие (сосняки, болота, более 300 видов растений, 27 видов из Красной книги РТ)."]]}], "uncertain_words": [], "plain_text": "Классификация ландшафтов г. Нижнекамска (продолжение)\nТип ландшафта\nПример (конкретный объект / территория)\nСтепень трансформации\nХарактерные признаки\nЛесохозяйственный\nЛесные массивы в окрестностях города\nУмеренная\nШироколиственные и хвойные леса со значительной долей вторичных мелколиственных пород (берёза, осина), используемые в хозяйстве.\nРекреационный\nКомплекс «Святой ключ»\nУмеренная\nБлагоустроенный лесной массив на склоне (лестницы, набережная), сохранена природная основа из хвойных и лиственных пород.\nСельскохозяйственный\nСельхозугодья в окрестностях города (пашни, поля).\nУмеренная\nЕстественная растительность заменена культурными посевами, почвы распаханы (чернозёмы, серые лесные).\nЛинейно-дорожный\nСеть авто- и железных дорог, коридоры ЛЭП.\nСильная (высокая)\nСплошное техногенное покрытие полотна, естественный почвенно-растительный покров полностью снят или замещён насыпями.\nПриродный (охраняемый)\nПамятник природы «Борковская дача»\nСлабая\nЕстественный пойменный рельеф с дюнами, высокое биоразнообразие (сосняки, болота, более 300 видов растений, 27 видов из Красной книги РТ).", "table_text": "Классификация ландшафтов г. Нижнекамска (продолжение)\nТип ландшафта\nПример (конкретный объект / территория)\nСтепень трансформации\nХарактерные признаки\nЛесохозяйственный\nЛесные массивы в окрестностях города\nУмеренная\nШироколиственные и хвойные леса со значительной долей вторичных мелколиственных пород (берёза, осина), используемые в хозяйстве.\nРекреационный\nКомплекс «Святой ключ»\nУмеренная\nБлагоустроенный лесной массив на склоне (лестницы, набережная), сохранена природная основа из хвойных и лиственных пород.\nСельскохозяйственный\nСельхозугодья в окрестностях города (пашни, поля).\nУмеренная\nЕстественная растительность заменена культурными посевами, почвы распаханы (чернозёмы, серые лесные).\nЛинейно-дорожный\nСеть авто- и железных дорог, коридоры ЛЭП.\nСильная (высокая)\nСплошное техногенное покрытие полотна, естественный почвенно-растительный покров полностью снят или замещён насыпями.\nПриродный (охраняемый)\nПамятник природы «Борковская дача»\nСлабая\nЕстественный пойменный рельеф с дюнами, высокое биоразнообразие (сосняки, болота, более 300 видов растений, 27 видов из Красной книги РТ)."}, {"page": 12, "date": "24.09.2026", "title": "Глобальные вызовы человечества и понятие устойчивого развития", "source_filename": "IMG_20261124_201425.webp", "captured_at_ms": "2026-11-24 20:14:26.066", "original_webp": "originals/page_12.webp", "blocks": [{"type": "paragraph", "text": "Вывод: в г. Нижнекамске преобладают антропогенные (городские и промышленные) ландшафты, при этом сохраняются природные рекреационные зоны (парки, побережье Камы), требующие экологического контроля."}, {"type": "marginalia", "text": "Пометка карандашом: {{?пр 3/}}"}, {"type": "heading", "level": 1, "text": "Глобальные вызовы человечества и понятие устойчивого развития."}, {"type": "definition", "term": "ОПЯ (Опасные природные явления)", "text": "Это события природного происхождения, которые могут нанести ущерб здоровью людей."}, {"type": "paragraph", "text": "К ним относятся: наводнения, цунами, землетрясения, ураганы, торнадо, оползни, лесные пожары."}, {"type": "paragraph", "text": "Повышения уровня мирового океана."}, {"type": "paragraph", "text": "{{?Климаты}}. Статистика."}, {"type": "definition", "term": "ЦУР", "text": "цели устойчивого развития."}, {"type": "paragraph", "text": "В 2015 году ООН приняла её."}, {"type": "paragraph", "text": "Мониторинг изменений."}, {"type": "definition", "term": "ЦУР 13", "text": "Это борьба с изменением климата. Обеспечение устойчивости населённых пунктов."}, {"type": "definition", "term": "ЦУР 6", "text": "обеспечение чистой воды и санитарии."}, {"type": "paragraph", "text": "Роль географии: Географы анализируют пространственное распределение ресурсов, уязвимость территорий, разрабатывают стратегию. Географы анализируют, разрабатывают стратегию, адаптацию к изменениям климата"}], "uncertain_words": [{"word": "пр 3/", "context": "Пометка карандашом под строкой «Вывод: (не успел :( )»"}, {"word": "Климаты", "context": "«{{?Климаты}}. Статистика.» — после строки «Повышения уровня мирового океана.»"}], "plain_text": "Вывод: в г. Нижнекамске преобладают антропогенные (городские и промышленные) ландшафты, при этом сохраняются природные рекреационные зоны (парки, побережье Камы), требующие экологического контроля.\nПометка карандашом: {{?пр 3/}}\nГлобальные вызовы человечества и понятие устойчивого развития.\nОПЯ (Опасные природные явления) — Это события природного происхождения, которые могут нанести ущерб здоровью людей.\nК ним относятся: наводнения, цунами, землетрясения, ураганы, торнадо, оползни, лесные пожары.\nПовышения уровня мирового океана.\n{{?Климаты}}. Статистика.\nЦУР — цели устойчивого развития.\nВ 2015 году ООН приняла её.\nМониторинг изменений.\nЦУР 13 — Это борьба с изменением климата. Обеспечение устойчивости населённых пунктов.\nЦУР 6 — обеспечение чистой воды и санитарии.\nРоль географии: Географы анализируют пространственное распределение ресурсов, уязвимость территорий, разрабатывают стратегию. Географы анализируют, разрабатывают стратегию, адаптацию к изменениям климата", "table_text": ""}, {"page": 13, "date": null, "title": "Климатические беженцы и роль географии в адаптации", "source_filename": "IMG_20261124_201436.webp", "captured_at_ms": "2026-11-24 20:14:36.696", "original_webp": "originals/page_13.webp", "blocks": [{"type": "marginalia", "text": "ЭССЕ. Д/з: Может ли мой регион стать территорией климатической миграции?"}, {"type": "paragraph", "text": "и рационального природопользования."}, {"type": "list", "ordered": true, "items": ["Почему проблема климатических беженцев является вызовом для международного права.", "Как географические знания могут помочь в адаптации?"]}, {"type": "heading", "level": 2, "text": "1. Ответ на первый вопрос:"}, {"type": "list", "ordered": false, "items": ["Нет правового статуса: Конвенция ООН 1951 года защищает только жертв преследований и войн. Климатические мигранты юридически «не существуют» и лишены права на убежище.", "Проблема исчезающих государств: Затопление территорий (например, малых островов) уничтожает признак государства (землю), создавая прецедент массового безгражданства.", "Размытая ответственность: Невозможно юридически обязать конкретную страну принять пострадавших, так как за климат несёт вину всё человечество, а не отдельный агрессор."]}, {"type": "heading", "level": 2, "text": "Вопрос 2:"}, {"type": "paragraph", "text": "География с помощью спутников и цифровых карт точно определяет зоны будущих затоплений, засух и оползней. Это позволяет не строить жильё в опасных местах, вовремя возво-"}], "uncertain_words": [], "plain_text": "ЭССЕ. Д/з: Может ли мой регион стать территорией климатической миграции?\nи рационального природопользования.\nПочему проблема климатических беженцев является вызовом для международного права.\nКак географические знания могут помочь в адаптации?\n1. Ответ на первый вопрос:\nНет правового статуса: Конвенция ООН 1951 года защищает только жертв преследований и войн. Климатические мигранты юридически «не существуют» и лишены права на убежище.\nПроблема исчезающих государств: Затопление территорий (например, малых островов) уничтожает признак государства (землю), создавая прецедент массового безгражданства.\nРазмытая ответственность: Невозможно юридически обязать конкретную страну принять пострадавших, так как за климат несёт вину всё человечество, а не отдельный агрессор.\nВопрос 2:\nГеография с помощью спутников и цифровых карт точно определяет зоны будущих затоплений, засух и оползней. Это позволяет не строить жильё в опасных местах, вовремя возво-", "table_text": ""}, {"page": 14, "date": null, "title": "Эссе: «Может ли мой регион стать территорией климатической миграции?»", "source_filename": "IMG_20261124_201442.webp", "captured_at_ms": "2026-11-24 20:14:44.408", "original_webp": "originals/page_14.webp", "blocks": [{"type": "paragraph", "text": "дить дамбы и заранее переносить посевы культур в подходящие по климату районы."}, {"type": "heading", "level": 1, "text": "ЭССЕ на тему «Может ли мой регион стать территорией климатической миграции?»"}, {"type": "paragraph", "text": "В условиях нарастающей аридизации (засушливости) Евразии Татарстан неизбежно превратится в климатического реципиента."}, {"type": "paragraph", "text": "Главный стратегический pull-фактор региона — уникальный гидрологический каркас на слиянии Волги и Камы. Гарантированный доступ к пресной воде, устойчивые агроклиматические условия и развитая инфраструктура делают республику естественным магнитом для населения из стремительно высыхающих зон Центральной Азии и юга европейской России."}, {"type": "paragraph", "text": "Однако этот статус несёт жёсткий вызов. Массовый приток людей приведёт к предельной антропогенной нагрузке на экосистему Куйбышевского водохранилища и проверит на прочность несущую ёмкость городов."}, {"type": "callout", "label": "Вывод", "text": "Татарстан станет климатическим убежищем Поволжья. Превратится ли миграционный приток в экономический стимул или в ресурсный кризис, определит исключительно скорость опережающего градостроительства и водного менеджмента республики."}], "uncertain_words": [], "plain_text": "дить дамбы и заранее переносить посевы культур в подходящие по климату районы.\nЭССЕ на тему «Может ли мой регион стать территорией климатической миграции?»\nВ условиях нарастающей аридизации (засушливости) Евразии Татарстан неизбежно превратится в климатического реципиента.\nГлавный стратегический pull-фактор региона — уникальный гидрологический каркас на слиянии Волги и Камы. Гарантированный доступ к пресной воде, устойчивые агроклиматические условия и развитая инфраструктура делают республику естественным магнитом для населения из стремительно высыхающих зон Центральной Азии и юга европейской России.\nОднако этот статус несёт жёсткий вызов. Массовый приток людей приведёт к предельной антропогенной нагрузке на экосистему Куйбышевского водохранилища и проверит на прочность несущую ёмкость городов.\nВывод: Татарстан станет климатическим убежищем Поволжья. Превратится ли миграционный приток в экономический стимул или в ресурсный кризис, определит исключительно скорость опережающего градостроительства и водного менеджмента республики.", "table_text": ""}, {"page": 15, "date": null, "title": "Практическая работа № 3. Оценка природно-ресурсного капитала России", "source_filename": "IMG_20261124_201457.webp", "captured_at_ms": "2026-11-24 20:14:57.895", "original_webp": "originals/page_15.webp", "blocks": [{"type": "heading", "level": 1, "text": "Практическая работа № 3"}, {"type": "heading", "level": 2, "text": "Тема: Оценка природно-ресурсного капитала России по источникам географической информации."}, {"type": "paragraph", "text": "Цель: Оценить природно-ресурсный капитал России по источникам географической информации."}, {"type": "heading", "level": 2, "text": "Задание 1."}, {"type": "paragraph", "text": "Страна: Россия."}, {"type": "paragraph", "text": "Виды ресурсов:"}, {"type": "list", "ordered": false, "items": ["минеральные (природный газ, нефть, уголь, руды чёрных и цветных металлов);", "лесные (массивы хвойной тайги Сибири и Европейского Севера);", "земельные (чернозёмные и каштановые почвы юга Русской равнины);", "водные (озеро Байкал, реки Волга, Обь, Енисей, Лена);", "рекреационные (Кавказ, Алтай, Камчатка, Байкал, города Золотого кольца)."]}, {"type": "heading", "level": 2, "text": "№ 2."}, {"type": "paragraph", "text": "Основа экономики: минерально-топливные, рудные, водные и лесные ресурсы."}, {"type": "paragraph", "text": "1. Топливные (газ и нефть Западной Сибири, каменный уголь Кузбасса) — база энергетики, внутреннего"}], "uncertain_words": [], "plain_text": "Практическая работа № 3\nТема: Оценка природно-ресурсного капитала России по источникам географической информации.\nЦель: Оценить природно-ресурсный капитал России по источникам географической информации.\nЗадание 1.\nСтрана: Россия.\nВиды ресурсов:\nминеральные (природный газ, нефть, уголь, руды чёрных и цветных металлов);\nлесные (массивы хвойной тайги Сибири и Европейского Севера);\nземельные (чернозёмные и каштановые почвы юга Русской равнины);\nводные (озеро Байкал, реки Волга, Обь, Енисей, Лена);\nрекреационные (Кавказ, Алтай, Камчатка, Байкал, города Золотого кольца).\n№ 2.\nОснова экономики: минерально-топливные, рудные, водные и лесные ресурсы.\n1. Топливные (газ и нефть Западной Сибири, каменный уголь Кузбасса) — база энергетики, внутреннего", "table_text": ""}, {"page": 16, "date": null, "title": "Природные ресурсы России и мира (продолжение, № 3–4)", "source_filename": "IMG_20261124_201504.webp", "captured_at_ms": "2026-11-24 20:15:05.589", "original_webp": "originals/page_16.webp", "blocks": [{"type": "paragraph", "text": "рынка и валютных доходов страны."}, {"type": "list", "ordered": false, "items": ["2. Рудные (железная руда КМА, никель и медь Норильска и Урала) — обеспечивают мощный металлургический комплекс.", "3. Водные (гидропотенциал рек Сибири) — дают дешёвое электричество на крупнейших ГЭС (Саяно-Шушенская, Красноярская).", "4. Лесные (крупнейшие запасы древесины в мире) — питают деревообрабатывающую и целлюлозно-бумажную промышленность."]}, {"type": "heading", "level": 2, "text": "№ 3"}, {"type": "callout", "label": "Оценка", "text": "капитал колоссальный по объёму, практически не имеет мировых аналогов по богатству и разнообразию, страна самодостаточна по всем основным видам сырья."}, {"type": "callout", "label": "Вывод", "text": "мощная ресурсная база гарантирует сырьевую безопасность и промышленную независимость России, а ключевая задача состоит в глубокой переработке сырья и сбережении природы северных регионов."}, {"type": "heading", "level": 2, "text": "№ 4"}, {"type": "paragraph", "text": "1) Россия, 4) Иран, 5. Китай, 6. Индонезия, 10. Венесуэла. Высокими запасами из списка также обладает 8. Канада."}], "uncertain_words": [], "plain_text": "рынка и валютных доходов страны.\n2. Рудные (железная руда КМА, никель и медь Норильска и Урала) — обеспечивают мощный металлургический комплекс.\n3. Водные (гидропотенциал рек Сибири) — дают дешёвое электричество на крупнейших ГЭС (Саяно-Шушенская, Красноярская).\n4. Лесные (крупнейшие запасы древесины в мире) — питают деревообрабатывающую и целлюлозно-бумажную промышленность.\n№ 3\nОценка: капитал колоссальный по объёму, практически не имеет мировых аналогов по богатству и разнообразию, страна самодостаточна по всем основным видам сырья.\nВывод: мощная ресурсная база гарантирует сырьевую безопасность и промышленную независимость России, а ключевая задача состоит в глубокой переработке сырья и сбережении природы северных регионов.\n№ 4\n1) Россия, 4) Иран, 5. Китай, 6. Индонезия, 10. Венесуэла. Высокими запасами из списка также обладает 8. Канада.", "table_text": ""}, {"page": 17, "date": null, "title": "Запасы природного газа и классификация минеральных ресурсов (№ 5–6)", "source_filename": "IMG_20261124_201521.webp", "captured_at_ms": "2026-11-24 20:15:22.856", "original_webp": "originals/page_17.webp", "blocks": [{"type": "heading", "level": 2, "text": "№ 5."}, {"type": "paragraph", "text": "Страны с наибольшими запасами природного газа: 1. Россия, 4. Иран, 5. Китай, 6. Индонезия, 10. Венесуэла."}, {"type": "paragraph", "text": "Высокими запасами из списка также обладает 8 (Канада)."}, {"type": "heading", "level": 2, "text": "№ 6."}, {"type": "list", "ordered": false, "items": ["А) топливным — нефть, горючий газ, каменный уголь, бурый уголь, торф.", "Б) Рудным — железная руда, медная руда, бокситы, никелевая руда, свинцово-цинковая руда.", "В) Горно-химическим — калийная соль, каменная соль, апатиты, фосфориты, самородная сера.", "Г) строительным материалам — гранит, известняк, щебень, строительный песок, глина."]}, {"type": "marginalia", "text": "Оценка карандашом: 4 (подпись)"}, {"type": "heading", "level": 1, "text": "Основные природные ресурсы мира"}, {"type": "paragraph", "text": "Природно-ресурсный потенциал — совокупность природных ресурсов территории, пригодных для использования в хозяйстве при современном уровне развития техники."}], "uncertain_words": [{"word": "{{?Рес.}}", "context": "Сокращённое или неразборчиво написанное слово перед «Совокупность ресурсов» внизу страницы"}], "plain_text": "№ 5.\nСтраны с наибольшими запасами природного газа: 1. Россия, 4. Иран, 5. Китай, 6. Индонезия, 10. Венесуэла.\nВысокими запасами из списка также обладает 8 (Канада).\n№ 6.\nА) топливным — нефть, горючий газ, каменный уголь, бурый уголь, торф.\nБ) Рудным — железная руда, медная руда, бокситы, никелевая руда, свинцово-цинковая руда.\nВ) Горно-химическим — калийная соль, каменная соль, апатиты, фосфориты, самородная сера.\nГ) строительным материалам — гранит, известняк, щебень, строительный песок, глина.\nОценка карандашом: 4 (подпись)\nОсновные природные ресурсы мира\nПриродно-ресурсный потенциал — совокупность природных ресурсов территории, пригодных для использования в хозяйстве при современном уровне развития техники.", "table_text": ""}, {"page": 18, "date": null, "title": "Стратегические ресурсы и ресурсообеспеченность", "source_filename": "IMG_20261124_201531.webp", "captured_at_ms": "2026-11-24 20:15:33.231", "original_webp": "originals/page_18.webp", "blocks": [{"type": "paragraph", "text": "в мире, которые могут быть использованы в хозяйственной деятельности с учётом технических и экономических возможностей; это соотношение между запасами ресурса и объёмами его потребления. Выражается количеством лет, на которые хватит запасов при текущем уровне. Истощение ресурсов — это уровень, при котором дальнейшая добыча становится экономически или нецелесообразной."}, {"type": "heading", "level": 2, "text": "Стратегические ресурсы (нефть, газ, уран, руды)"}, {"type": "table", "caption": "Стратегические ресурсы (нефть, газ, уран, руды)", "continued_from_prev": false, "continues_to_next": false, "headers": ["№", "Ресурс", "Основные страны и регионы"], "rows": [["1", "Нефть", "Основные запасы на Ближнем Востоке (Саудовская Аравия, Иран, Ирак). Крупными запасами обладают Россия, США, Венесуэла."], ["2", "Газ", "Иран, Россия, Туркменистан, Иран, {{?США}}."], ["3", "Уран", "Канада, Россия, Австралия, {{?Россия}}, Китай."], ["4", "Железная руда", "Бразилия, Россия."], ["5", "Медные руды", "Россия."], ["", "Итог", "Россия занимает особое положение, которое обладает в мире крупнейшими запасами газа, нефти, железных руд, угля, никеля, алмазами, лесными и водными ресурсами."]]}, {"type": "paragraph", "text": "Ресурсообеспеченность — соотношение между величиной природных ресурсов и размерами их использования (выражается числом лет, на которое хватит ресурса, или объёмом запасов на душу населения)."}], "uncertain_words": [{"word": "{{?США}}", "context": "Строка «2 | Газ»: последнее слово у правого поля сильно сжато и наезжает на край"}, {"word": "{{?Россия}}", "context": "Строка «3 | Уран»: четвёртое слово в списке стран написано неразборчиво, повторяет «Россия»"}], "plain_text": "в мире, которые могут быть использованы в хозяйственной деятельности с учётом технических и экономических возможностей; это соотношение между запасами ресурса и объёмами его потребления. Выражается количеством лет, на которые хватит запасов при текущем уровне. Истощение ресурсов — это уровень, при котором дальнейшая добыча становится экономически или нецелесообразной.\nСтратегические ресурсы (нефть, газ, уран, руды)\nСтратегические ресурсы (нефть, газ, уран, руды)\n№\nРесурс\nОсновные страны и регионы\n1\nНефть\nОсновные запасы на Ближнем Востоке (Саудовская Аравия, Иран, Ирак). Крупными запасами обладают Россия, США, Венесуэла.\n2\nГаз\nИран, Россия, Туркменистан, Иран, {{?США}}.\n3\nУран\nКанада, Россия, Австралия, {{?Россия}}, Китай.\n4\nЖелезная руда\nБразилия, Россия.\n5\nМедные руды\nРоссия.\nИтог\nРоссия занимает особое положение, которое обладает в мире крупнейшими запасами газа, нефти, железных руд, угля, никеля, алмазами, лесными и водными ресурсами.\nРесурсообеспеченность — соотношение между величиной природных ресурсов и размерами их использования (выражается числом лет, на которое хватит ресурса, или объёмом запасов на душу населения).", "table_text": "Стратегические ресурсы (нефть, газ, уран, руды)\n№\nРесурс\nОсновные страны и регионы\n1\nНефть\nОсновные запасы на Ближнем Востоке (Саудовская Аравия, Иран, Ирак). Крупными запасами обладают Россия, США, Венесуэла.\n2\nГаз\nИран, Россия, Туркменистан, Иран, {{?США}}.\n3\nУран\nКанада, Россия, Австралия, {{?Россия}}, Китай.\n4\nЖелезная руда\nБразилия, Россия.\n5\nМедные руды\nРоссия.\nИтог\nРоссия занимает особое положение, которое обладает в мире крупнейшими запасами газа, нефти, железных руд, угля, никеля, алмазами, лесными и водными ресурсами."}, {"page": 19, "date": null, "title": "Практическая работа № 5. Темп прироста населения", "source_filename": "IMG_20261124_201544.webp", "captured_at_ms": "2026-11-24 20:15:44.775", "original_webp": "originals/page_19.webp", "blocks": [{"type": "paragraph", "text": "1. Количество лет, на которое хватит запасов ресурса (Р = Запасы / Добыча)."}, {"type": "heading", "level": 1, "text": "Практическая работа № 5"}, {"type": "heading", "level": 2, "text": "Задание 1. Таблица «Темп прироста населения»."}, {"type": "formula", "latex": "\\text{Темп} = \\frac{\\text{КН} - \\text{КП}}{\\text{КП}} \\times 100\\%", "label": "Формула темпа прироста населения"}, {"type": "table", "caption": "Темп прироста населения", "continued_from_prev": false, "continues_to_next": false, "headers": ["Страна", "Численность населения в 2023 (в млн ч)", "Численность населения в 2024 (млн ч)", "Темп прироста (%)"], "rows": [["Индия", "1438", "1450", "+0,83%"], ["Китай", "1423", "1419", "-0,28%"], ["США", "343", "345", "+0,58%"], ["Индонезия", "281", "283", "+0,71%"], ["Пакистан", "248", "251", "+1,21%"], ["Нигерия", "228", "233", "+2,19%"], ["Бразилия", "211", "212", "+0,47%"], ["Бангладеш", "171", "174", "+1,75%"], ["Россия", "145", "145", "0,00%"]]}, {"type": "callout", "label": "Вывод к 1 заданию", "text": "В развитых странах темпы роста замедляются."}], "uncertain_words": [{"word": "{{?лет}}", "context": "Первая строка сверху: «1. Количество лет, на которую хватит {{?лет}}.» — последнее слово написано очень бегло"}], "plain_text": "1. Количество лет, на которое хватит запасов ресурса (Р = Запасы / Добыча).\nПрактическая работа № 5\nЗадание 1. Таблица «Темп прироста населения».\nФормула темпа прироста населения \\text{Темп} = \\frac{\\text{КН} - \\text{КП}}{\\text{КП}} \\times 100\\%\nТемп прироста населения\nСтрана\nЧисленность населения в 2023 (в млн ч)\nЧисленность населения в 2024 (млн ч)\nТемп прироста (%)\nИндия\n1438\n1450\n+0,83%\nКитай\n1423\n1419\n-0,28%\nСША\n343\n345\n+0,58%\nИндонезия\n281\n283\n+0,71%\nПакистан\n248\n251\n+1,21%\nНигерия\n228\n233\n+2,19%\nБразилия\n211\n212\n+0,47%\nБангладеш\n171\n174\n+1,75%\nРоссия\n145\n145\n0,00%\nВывод к 1 заданию: В развитых странах темпы роста замедляются.", "table_text": "Темп прироста населения\nСтрана\nЧисленность населения в 2023 (в млн ч)\nЧисленность населения в 2024 (млн ч)\nТемп прироста (%)\nИндия\n1438\n1450\n+0,83%\nКитай\n1423\n1419\n-0,28%\nСША\n343\n345\n+0,58%\nИндонезия\n281\n283\n+0,71%\nПакистан\n248\n251\n+1,21%\nНигерия\n228\n233\n+2,19%\nБразилия\n211\n212\n+0,47%\nБангладеш\n171\n174\n+1,75%\nРоссия\n145\n145\n0,00%"}, {"page": 20, "date": null, "title": "Практическая работа № 6. Демографическая политика", "source_filename": "IMG_20261124_201553.webp", "captured_at_ms": "2026-11-24 20:15:55.176", "original_webp": "originals/page_20.webp", "blocks": [{"type": "formula", "latex": "\\text{ЕП} = \\text{Р} - \\text{С}", "label": "Задание 2"}, {"type": "heading", "level": 1, "text": "Практическая работа № 6"}, {"type": "heading", "level": 2, "text": "Объяснение особенности демографической политики в странах с различными типами воспроизводства населения."}, {"type": "callout", "label": "Цель работы", "text": "научиться выявлять и объяснять особенности демографической политики в странах с различными типами воспроизводства населения; сравнивать подходы и инструменты демографической политики в странах с расширенным и суженным типами воспроизводства; оценивать эффективность демографических мер и формулировать выводы о факторах, влияющих на результативность демографической политики."}, {"type": "heading", "level": 2, "text": "Задание 1:"}, {"type": "paragraph", "text": "Анализ:"}, {"type": "list", "ordered": false, "items": ["Страны с расширенным типом (Нигер, Сомали, ДР Конго): Высокий СКР (> 6) и естественный прирост (> 3%). Политика нацелена на снижение рождаемости.", "Страны с суженным типом (Россия, Япония, Южная Корея): Низкий СКР (< 1,5) и убыль населения. Политика нацелена на рост рождаемости."]}, {"type": "callout", "label": "Вывод по заданию 1", "text": "Тип воспроизводства популяции задаёт вектор политики: при высоком приросте — сдерживание, при депопуляции — стимулирование."}], "uncertain_words": [], "plain_text": "Задание 2 \\text{ЕП} = \\text{Р} - \\text{С}\nПрактическая работа № 6\nОбъяснение особенности демографической политики в странах с различными типами воспроизводства населения.\nЦель работы: научиться выявлять и объяснять особенности демографической политики в странах с различными типами воспроизводства населения; сравнивать подходы и инструменты демографической политики в странах с расширенным и суженным типами воспроизводства; оценивать эффективность демографических мер и формулировать выводы о факторах, влияющих на результативность демографической политики.\nЗадание 1:\nАнализ:\nСтраны с расширенным типом (Нигер, Сомали, ДР Конго): Высокий СКР (> 6) и естественный прирост (> 3%). Политика нацелена на снижение рождаемости.\nСтраны с суженным типом (Россия, Япония, Южная Корея): Низкий СКР (< 1,5) и убыль населения. Политика нацелена на рост рождаемости.\nВывод по заданию 1: Тип воспроизводства популяции задаёт вектор политики: при высоком приросте — сдерживание, при депопуляции — стимулирование.", "table_text": ""}, {"page": 21, "date": null, "title": "Демографическая политика: Китай, Россия, Япония (Задания 2–3)", "source_filename": "IMG_20261124_201605.webp", "captured_at_ms": "2026-11-24 20:16:06.712", "original_webp": "originals/page_21.webp", "blocks": [{"type": "heading", "level": 2, "text": "Задание 2. Анализ политики (Китай)"}, {"type": "paragraph", "text": "Таблица (численность населения): 1970 г. — 0,83 млрд; 1980 г. — 0,98 млрд; 2020 г. — 1,41 млрд."}, {"type": "paragraph", "text": "Инструменты политики: Штрафы за второго ребёнка, принудительная стерилизация, пропаганда поздних браков."}, {"type": "paragraph", "text": "Результаты: СКР упал до 1,28. Негатив: старение нации, дефицит женщин, нехватка рабочей силы."}, {"type": "callout", "label": "Вывод по заданию 2", "text": "Запреты быстро снижают прирост, но вызывают тяжёлый кризис старения населения."}, {"type": "heading", "level": 2, "text": "Задание 3: Анализ демографической политики в странах с суженным типом."}, {"type": "paragraph", "text": "Пример: Россия."}, {"type": "list", "ordered": false, "items": ["Инструменты демографической политики: материнский капитал, льготная семейная ипотека, единые детские пособия, налоговые льготы многодетным."]}, {"type": "paragraph", "text": "Особенности подхода: Упор на прямую денежную стимуляцию семей и поощрение вторых и последующих детей."}, {"type": "paragraph", "text": "Пример: Япония."}, {"type": "list", "ordered": false, "items": ["Инструменты демографической поли-"]}], "uncertain_words": [], "plain_text": "Задание 2. Анализ политики (Китай)\nТаблица (численность населения): 1970 г. — 0,83 млрд; 1980 г. — 0,98 млрд; 2020 г. — 1,41 млрд.\nИнструменты политики: Штрафы за второго ребёнка, принудительная стерилизация, пропаганда поздних браков.\nРезультаты: СКР упал до 1,28. Негатив: старение нации, дефицит женщин, нехватка рабочей силы.\nВывод по заданию 2: Запреты быстро снижают прирост, но вызывают тяжёлый кризис старения населения.\nЗадание 3: Анализ демографической политики в странах с суженным типом.\nПример: Россия.\nИнструменты демографической политики: материнский капитал, льготная семейная ипотека, единые детские пособия, налоговые льготы многодетным.\nОсобенности подхода: Упор на прямую денежную стимуляцию семей и поощрение вторых и последующих детей.\nПример: Япония.\nИнструменты демографической поли-", "table_text": ""}, {"page": 22, "date": null, "title": "Демографическая политика Японии и итоговый анализ (Задания 3, 5)", "source_filename": "IMG_20261124_201613.webp", "captured_at_ms": "2026-11-24 20:16:14.055", "original_webp": "originals/page_22.webp", "blocks": [{"type": "paragraph", "text": "тики: развитие сети яслей и детсадов, оплачиваемые отпуска для отцов, реформы сокращения переработок на работе (Work-Life balance)."}, {"type": "paragraph", "text": "Особенности подхода: акцент на изменение консервативной корпоративной культуры и создание условий для совмещения карьеры и материнства."}, {"type": "callout", "label": "Вывод по заданию 3", "text": "Прямые денежные выплаты без глубоких институциональных реформ дают лишь кратковременный эффект, преодоление суженного воспроизводства требует системного изменения условий жизни семей."}, {"type": "heading", "level": 2, "text": "Задание 5:"}, {"type": "paragraph", "text": "Анализ: Страны, делающие ставку исключительно на денежные выплаты (Россия) или инвестиции без изменения трудовой этики (Южная Корея), имеют низкую эффективность мер (СКР 0,8–1,4). Комплексный подход (Франция, Швеция), сочетающий пособия с развитой сетью яслей и гендерным равенством, обеспечивает стабильный СКР (1,7–1,8)."}, {"type": "callout", "label": "Вывод по заданию 5", "text": "Эффективность политики определяется не объёмом прямых выплат, а развитием социальной инфраструктуры, позволяющей женщине не выбирать между карьерой и ребёнком."}, {"type": "marginalia", "text": "Оценка карандашом: 4 (подпись)"}], "uncertain_words": [], "plain_text": "тики: развитие сети яслей и детсадов, оплачиваемые отпуска для отцов, реформы сокращения переработок на работе (Work-Life balance).\nОсобенности подхода: акцент на изменение консервативной корпоративной культуры и создание условий для совмещения карьеры и материнства.\nВывод по заданию 3: Прямые денежные выплаты без глубоких институциональных реформ дают лишь кратковременный эффект, преодоление суженного воспроизводства требует системного изменения условий жизни семей.\nЗадание 5:\nАнализ: Страны, делающие ставку исключительно на денежные выплаты (Россия) или инвестиции без изменения трудовой этики (Южная Корея), имеют низкую эффективность мер (СКР 0,8–1,4). Комплексный подход (Франция, Швеция), сочетающий пособия с развитой сетью яслей и гендерным равенством, обеспечивает стабильный СКР (1,7–1,8).\nВывод по заданию 5: Эффективность политики определяется не объёмом прямых выплат, а развитием социальной инфраструктуры, позволяющей женщине не выбирать между карьерой и ребёнком.\nОценка карандашом: 4 (подпись)", "table_text": ""}, {"page": 23, "date": "15.10.2026", "title": "Мировое хозяйство", "source_filename": "IMG_20261124_201623.webp", "captured_at_ms": "2026-11-24 20:16:25.046", "original_webp": "originals/page_23.webp", "blocks": [{"type": "heading", "level": 1, "text": "Мировое хозяйство"}, {"type": "paragraph", "text": "Международная экономическая интеграция."}, {"type": "definition", "term": "МРТ", "text": "международное разделение труда."}, {"type": "definition", "term": "Мировое хозяйство", "text": "это {{?экономическая}} совокупность всех национальных хозяйств всех стран, которые связаны между собой всемирными и экономическими отношениями."}, {"type": "paragraph", "text": "Международные интеграционные группировки, мировые рынки, отраслевая структура — это первичный сектор, входит сфера услуг."}, {"type": "callout", "label": "Пример для электромонтажника", "text": "Электротехника (она — это базовая отрасль вторичного сектора, который обеспечивает работу всех отраслей)."}, {"type": "definition", "term": "Мировое хозяйство", "text": "это исторически сложившаяся совокупность национальных хозяйств всех стран мира, которые связаны между собой всемирными экономическими отношениями — международное разделение труда (МРТ)."}, {"type": "heading", "level": 2, "text": "Состав мирового хозяйства"}, {"type": "list", "ordered": true, "items": ["Национальные экономики. Около 200 стран, экономические организации.", "Мировые рынки.", "Первичный сектор: это сельское хозяйство.", "Глобализация мировой экономики."]}, {"type": "definition", "term": "Глобализация", "text": "это процесс всемирной экономической, политической и культурной интеграции. Превращение мира в единое экономическое пространство."}], "uncertain_words": [{"word": "экономическая", "context": "Мировое хозяйство — это {{?экономическая}} совокупность всех национальных хозяйств всех стран"}], "plain_text": "Мировое хозяйство\nМеждународная экономическая интеграция.\nМРТ — международное разделение труда.\nМировое хозяйство — это {{?экономическая}} совокупность всех национальных хозяйств всех стран, которые связаны между собой всемирными и экономическими отношениями.\nМеждународные интеграционные группировки, мировые рынки, отраслевая структура — это первичный сектор, входит сфера услуг.\nПример для электромонтажника: Электротехника (она — это базовая отрасль вторичного сектора, который обеспечивает работу всех отраслей).\nМировое хозяйство — это исторически сложившаяся совокупность национальных хозяйств всех стран мира, которые связаны между собой всемирными экономическими отношениями — международное разделение труда (МРТ).\nСостав мирового хозяйства\nНациональные экономики. Около 200 стран, экономические организации.\nМировые рынки.\nПервичный сектор: это сельское хозяйство.\nГлобализация мировой экономики.\nГлобализация — это процесс всемирной экономической, политической и культурной интеграции. Превращение мира в единое экономическое пространство.", "table_text": ""}, {"page": 24, "date": null, "title": "Электротехнические ТНК и страны базирования", "source_filename": "IMG_20261124_201632.webp", "captured_at_ms": "2026-11-24 20:16:34.052", "original_webp": "originals/page_24.webp", "blocks": [{"type": "heading", "level": 2, "text": "Задание 1. Таблица «Электротехнические ТНК»"}, {"type": "table", "caption": "Электро ргетики", "source_filename": "IMG_20261124_201652.webp", "captured_at_ms": "2026-11-24 20:16:52.966", "original_webp": "originals/page_26.webp", "blocks": [{"type": "table", "caption": "Анализ структуры ВВП (продолжение)", "continued_from_prev": true, "continues_to_next": false, "headers": ["Страна", "Тип экономики"], "rows": [["Мексика", "Индустриальная"], ["Россия", "Индустриально-постиндустриальная"], ["Германия", "Постиндустриальная"], ["США", "Постиндустриальная"], ["Япония", "Постиндустриальная"]]}, {"type": "heading", "level": 2, "text": "Задание 2. Сравнение занятости"}, {"type": "table", "caption": "Сравнение занятости", "continued_from_prev": false, "continues_to_next": false, "headers": ["Показатель", "Чад", "Китай", "США"], "rows": [["Занятость в с/х", "80%", "25%", "2%"], ["Занятость в промышленности", "5%", "30%", "19%"], ["Занятость в услугах", "15%", "45%", "79%"]]}, {"type": "callout", "label": "Вывод", "text": "При переходе от аграрной экономики к постиндустриальной доля занятых в сельском хозяйстве резко сокращается (с 80% до 2%), в промышленности сначала растёт, а затем снижается, тогда как в сфере услуг непрерывно увеличивается, достигая подавляющего большинства (до 79%)."}, {"type": "heading", "level": 2, "text": "Задание 3. Анализ электроэнергетики"}, {"type": "paragraph", "text": "1. Ответ: В Чаде (9%)."}, {"type": "paragraph", "text": "Причина: Низкий уровень экономического развития (аграрный тип экономики), нехватка мощностей электростанций и отсутствие развитой сетевой"}], "uncertain_words": [], "plain_text": "Анализ структуры ВВП (продолжение)\nСтрана\nТип экономики\nМексика\nИндустриальная\nРоссия\nИндустриально-постиндустриальная\nГермания\nПостиндустриальная\nСША\nПостиндустриальная\nЯпония\nПостиндустриальная\nЗадание 2. Сравнение занятости\nСравнение занятости\nПоказатель\nЧад\nКитай\nСША\nЗанятость в с/х\n80%\n25%\n2%\nЗанятость в промышленности\n5%\n30%\n19%\nЗанятость в услугах\n15%\n45%\n79%\nВывод: При переходе от аграрной экономики к постиндустриальной доля занятых в сельском хозяйстве резко сокращается (с 80% до 2%), в промышленности сначала растёт, а затем снижается, тогда как в сфере услуг непрерывно увеличивается, достигая подавляющего большинства (до 79%).\nЗадание 3. Анализ электроэнергетики\n1. Ответ: В Чаде (9%).\nПричина: Низкий уровень экономического развития (аграрный тип экономики), нехватка мощностей электростанций и отсутствие развитой сетевой", "table_text": "Анализ структуры ВВП (продолжение)\nСтрана\nТип экономики\nМексика\nИндустриальная\nРоссия\nИндустриально-постиндустриальная\nГермания\nПостиндустриальная\nСША\nПостиндустриальная\nЯпония\nПостиндустриальная\nСравнение занятости\nПоказатель\nЧад\nКитай\nСША\nЗанятость в с/х\n80%\n25%\n2%\nЗанятость в промышленности\n5%\n30%\n19%\nЗанятость в услугах\n15%\n45%\n79%"}, {"page": 27, "date": null, "title": "Практическая работа № 9: Электроэнергетика и итоговая сравнительная таблица", "source_filename": "IMG_20261124_201702.webp", "captured_at_ms": "2026-11-24 20:17:02.903", "original_webp": "originals/page_27.webp", "blocks": [{"type": "paragraph", "text": "инфраструктуры."}, {"type": "paragraph", "text": "2. Ответ: В Эфиопии (90%) и Германии (45%)."}, {"type": "paragraph", "text": "Причина: В Эфиопии высокий показатель обеспечен мощными гидроэлектростанциями (ГЭС). В Германии — целенаправленной государственной политикой «Зелёного» энергоперехода (развитие ветровой и солнечной энергетики)."}, {"type": "paragraph", "text": "3. Ответ: Прямая связь: чем выше уровень развития экономики (от аграрной к постиндустриальной), тем выше доступ населения к электросетям (от 9% в Чаде до 100% в развитых странах) и тем больше объём производства электроэнергии."}, {"type": "heading", "level": 2, "text": "Задание 5. Итоговая сравнительная таблица"}, {"type": "table", "caption": "Итоговая сравнительная таблица", "continued_from_prev": false, "continues_to_next": true, "headers": ["Критерий", "Аграрная (Чад)", "Индустриальная (Китай)", "Пост
